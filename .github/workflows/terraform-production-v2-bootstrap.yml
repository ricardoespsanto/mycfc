name: One-time production v2 secret bootstrap
run-name: v2 bootstrap ${{ inputs.phase }} ${{ inputs.sha }}

on:
  workflow_dispatch:
    inputs:
      phase:
        description: Run secret creation first, then the host-policy update in a separate approved run.
        type: choice
        required: true
        options: [secret, host-policy]
      sha:
        description: Exact current signed and CI-green main commit.
        type: string
        required: true

permissions: {}

concurrency:
  group: mycfc-production-infra
  cancel-in-progress: false

env:
  TERRAFORM_IMAGE: hashicorp/terraform:1.15.8@sha256:7ae513256f7ce67879e218ae8593d6fbe216ec9e123abe6c94e4e10704857963
  REQUESTED_STACK: production
  REQUESTED_PHASE: ${{ inputs.phase }}
  REQUESTED_SHA: ${{ inputs.sha }}
  TF_IN_AUTOMATION: 'true'
  TF_PLUGIN_CACHE_DIR: /terraform-plugin-cache

jobs:
  plan:
    runs-on: ubuntu-24.04
    environment: production-plan
    permissions:
      actions: read
      contents: read
      id-token: write
    outputs:
      review_sha: ${{ steps.plan.outputs.review_sha }}
      semantic_hmac: ${{ steps.plan.outputs.semantic_hmac }}
      manifest_hmac: ${{ steps.plan.outputs.manifest_hmac }}
      residual_sha: ${{ steps.plan.outputs.residual_sha }}
    env:
      AWS_REGION: ${{ vars.AWS_REGION }}
      AWS_INFRA_PLAN_ROLE_ARN: ${{ vars.AWS_INFRA_PLAN_ROLE_ARN }}
      TF_BACKEND_BUCKET: ${{ vars.TF_BACKEND_BUCKET }}
    steps:
      # actions/checkout v7.0.1
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ inputs.sha }}
          fetch-depth: 0
          persist-credentials: false
      - name: Verify exact current signed and CI-green main commit
        env:
          GH_TOKEN: ${{ github.token }}
          DISPATCH_REF: ${{ github.ref }}
          DISPATCH_SHA: ${{ github.sha }}
        run: |
          set -Eeuo pipefail
          preflight_fail() { echo "::error::Bootstrap preflight $1 failed" >&2; exit 1; }
          [[ "$REQUESTED_SHA" =~ ^[0-9a-f]{40}$ ]] || preflight_fail sha-format
          test "$DISPATCH_REF" = refs/heads/main || preflight_fail dispatch-ref
          test "$REQUESTED_SHA" = "$DISPATCH_SHA" || preflight_fail dispatch-sha
          test "$REQUESTED_SHA" = "$(git rev-parse HEAD)" || preflight_fail checkout-sha
          test -n "$AWS_REGION" || preflight_fail aws-region-configured
          test -n "$AWS_INFRA_PLAN_ROLE_ARN" || preflight_fail plan-role-configured
          test -n "$TF_BACKEND_BUCKET" || preflight_fail backend-bucket-configured
          main_sha=$(gh api "/repos/${{ github.repository }}/git/ref/heads/main" --jq '.object.sha' 2>/dev/null) || preflight_fail main-ref-read
          test "$REQUESTED_SHA" = "$main_sha" || preflight_fail current-main-sha
          verified_sha=$(gh api "/repos/${{ github.repository }}/commits/$REQUESTED_SHA" --jq 'select(.commit.verification.verified == true and .commit.verification.reason == "valid") | .sha' 2>/dev/null) || preflight_fail commit-read
          test "$verified_sha" = "$REQUESTED_SHA" || preflight_fail commit-signature
          ci_run=$(gh api "/repos/${{ github.repository }}/actions/workflows/ci.yml/runs?branch=main&event=push&status=completed&per_page=100" --jq "([.workflow_runs[] | select(.head_sha == \"$REQUESTED_SHA\" and .head_branch == \"main\" and .event == \"push\" and .conclusion == \"success\")][0].id) // empty" 2>/dev/null) || preflight_fail ci-read
          test -n "$ci_run" || preflight_fail green-main-ci
      - name: Verify Terraform source and bootstrap policy
        run: |
          make terraform-check
          python3 scripts/terraform-v2-bootstrap-policy_test.py
      # aws-actions/configure-aws-credentials v6.2.4
      - uses: aws-actions/configure-aws-credentials@cbe3b392738ccf3f987d68400dafcf4b0624a56c
        with:
          role-to-assume: ${{ vars.AWS_INFRA_PLAN_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION }}
      - name: Prepare exact targeted plan for separate production approval
        id: plan
        env:
          STACK_TF_VARS: ${{ secrets.TF_VARS }}
          STACK_PROVIDER_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          TF_PLAN_HMAC_KEY: ${{ secrets.TF_PLAN_HMAC_KEY }}
          GH_TOKEN: ${{ github.token }}
        run: |
          set -Eeuo pipefail
          [[ "$TF_PLAN_HMAC_KEY" =~ ^[0-9a-f]{64}$ ]]
          source scripts/terraform-stack.sh
          trap 'terraform_stack_cleanup; rm -f "$TF_ROOT/residual.tfplan" "$TF_ROOT/residual.tfplan.json"' EXIT
          terraform_stack_prepare
          tf init -input=false -backend-config="bucket=$TF_BACKEND_BUCKET" -backend-config="key=$TF_BACKEND_KEY" -backend-config="region=$AWS_REGION"
          if ! tf plan -input=false -lock-timeout=5m -out=residual.tfplan >/dev/null 2>&1; then
            echo '::error::Read-only full residual plan failed; inspect protected runner diagnostics.' >&2
            exit 1
          fi
          tf show -json residual.tfplan > "$TF_ROOT/residual.tfplan.json"
          residual_sha=$(python3 scripts/terraform-v2-bootstrap-policy.py residual "$REQUESTED_PHASE" "$TF_ROOT/residual.tfplan.json")
          case "$REQUESTED_PHASE" in
            secret)
              targets=(
                -target=aws_secretsmanager_secret.runtime
                -target=aws_secretsmanager_secret.legacy_runtime
                -target=aws_secretsmanager_secret_version.runtime
                -target=aws_secretsmanager_secret_version.legacy_runtime
                -target=aws_secretsmanager_secret.app_runtime
                -target=aws_secretsmanager_secret_version.app_runtime
              )
              ;;
            host-policy) targets=(-target=aws_iam_user_policy.host_runtime) ;;
            *) exit 1 ;;
          esac
          manifest_hmac=$(python3 scripts/terraform-v2-bootstrap-policy.py manifest-hmac "$REQUESTED_PHASE" "${targets[@]}")
          if ! tf plan -input=false -lock-timeout=5m -out=production.tfplan "${targets[@]}" >/dev/null 2>&1; then
            echo '::error::Exact targeted plan failed; no apply was attempted.' >&2
            exit 1
          fi
          tf show -json production.tfplan > "$TF_ROOT/production.tfplan.json"
          python3 scripts/terraform-v2-bootstrap-policy.py validate "$REQUESTED_PHASE" "$TF_ROOT/production.tfplan.json"
          tf show -no-color production.tfplan > "$TF_ROOT/production.tfplan.review.txt"
          review_sha=$(sha256sum "$TF_ROOT/production.tfplan.review.txt" | awk '{print $1}')
          semantic_hmac=$(python3 scripts/terraform-plan-hmac.py "$TF_ROOT/production.tfplan.json")
          test "$REQUESTED_SHA" = "$(gh api "/repos/${{ github.repository }}/git/ref/heads/main" --jq '.object.sha')"
          {
            echo "review_sha=$review_sha"
            echo "semantic_hmac=$semantic_hmac"
            echo "manifest_hmac=$manifest_hmac"
            echo "residual_sha=$residual_sha"
          } >> "$GITHUB_OUTPUT"
          {
            echo "## One-time v2 bootstrap awaiting human production approval"
            echo
            printf -- "- Phase: \`%s\`; commit: \`%s\`\n" "$REQUESTED_PHASE" "$REQUESTED_SHA"
            echo "- Exact target policy: **passed**"
            printf -- "- Full residual address/action baseline SHA-256 (not semantic equivalence): \`%s\`\n" "$residual_sha"
            printf -- "- Redacted plan fingerprint: \`%s\`\n" "$review_sha"
            printf -- "- Keyed semantic plan HMAC: \`%s\`\n" "$semantic_hmac"
            printf -- "- Keyed fixed-target manifest HMAC: \`%s\`\n" "$manifest_hmac"
            echo
            echo "### Approved external resource actions"
            jq -r '.resource_changes[]? | select(.mode == "managed" and .change.actions != ["no-op"]) | "- `\(.address)`: `\(.change.actions | join(" → "))`"' "$TF_ROOT/production.tfplan.json"
            echo
            echo "Phase secret also requires two exact no-op legacy secret state-lineage moves. No full residual plan or secret values are printed or uploaded."
            echo
            echo "### Read-only un-targeted residual address/actions (not approved for apply)"
            python3 scripts/terraform-v2-bootstrap-policy.py residual-list "$REQUESTED_PHASE" "$TF_ROOT/residual.tfplan.json"
          } >> "$GITHUB_STEP_SUMMARY"

  apply:
    needs: plan
    runs-on: ubuntu-24.04
    environment: production
    permissions:
      contents: read
      id-token: write
    env:
      AWS_REGION: ${{ vars.AWS_REGION }}
      AWS_INFRA_APPLY_ROLE_ARN: ${{ vars.AWS_INFRA_APPLY_ROLE_ARN }}
      TF_BACKEND_BUCKET: ${{ vars.TF_BACKEND_BUCKET }}
    steps:
      # actions/checkout v7.0.1
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ inputs.sha }}
          fetch-depth: 0
          persist-credentials: false
      - name: Revalidate the approved commit
        env:
          GH_TOKEN: ${{ github.token }}
          DISPATCH_REF: ${{ github.ref }}
          DISPATCH_SHA: ${{ github.sha }}
        run: |
          set -Eeuo pipefail
          [[ "$REQUESTED_SHA" =~ ^[0-9a-f]{40}$ ]]
          test "$DISPATCH_REF" = refs/heads/main
          test "$REQUESTED_SHA" = "$DISPATCH_SHA"
          test "$REQUESTED_SHA" = "$(git rev-parse HEAD)"
          test "$REQUESTED_SHA" = "$(gh api "/repos/${{ github.repository }}/git/ref/heads/main" --jq '.object.sha')"
          test -n "${{ needs.plan.outputs.review_sha }}"
          test -n "${{ needs.plan.outputs.semantic_hmac }}"
          test -n "${{ needs.plan.outputs.manifest_hmac }}"
          test -n "${{ needs.plan.outputs.residual_sha }}"
      # aws-actions/configure-aws-credentials v6.2.4
      - uses: aws-actions/configure-aws-credentials@cbe3b392738ccf3f987d68400dafcf4b0624a56c
        with:
          role-to-assume: ${{ vars.AWS_INFRA_APPLY_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION }}
      - name: Recreate, match, apply saved target, and verify residual inventory
        env:
          STACK_TF_VARS: ${{ secrets.TF_VARS }}
          STACK_PROVIDER_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          TF_PLAN_HMAC_KEY: ${{ secrets.TF_PLAN_HMAC_KEY }}
          EXPECTED_REVIEW_SHA: ${{ needs.plan.outputs.review_sha }}
          EXPECTED_SEMANTIC_HMAC: ${{ needs.plan.outputs.semantic_hmac }}
          EXPECTED_MANIFEST_HMAC: ${{ needs.plan.outputs.manifest_hmac }}
          EXPECTED_RESIDUAL_SHA: ${{ needs.plan.outputs.residual_sha }}
          GH_TOKEN: ${{ github.token }}
        run: |
          set -Eeuo pipefail
          [[ "$TF_PLAN_HMAC_KEY" =~ ^[0-9a-f]{64}$ ]]
          [[ "$EXPECTED_REVIEW_SHA" =~ ^[0-9a-f]{64}$ ]]
          [[ "$EXPECTED_SEMANTIC_HMAC" =~ ^[0-9a-f]{64}$ ]]
          [[ "$EXPECTED_MANIFEST_HMAC" =~ ^[0-9a-f]{64}$ ]]
          [[ "$EXPECTED_RESIDUAL_SHA" =~ ^[0-9a-f]{64}$ ]]
          source scripts/terraform-stack.sh
          trap 'terraform_stack_cleanup; rm -f "$TF_ROOT/residual.tfplan" "$TF_ROOT/residual.tfplan.json" "$TF_ROOT/after.tfplan" "$TF_ROOT/after.tfplan.json"' EXIT
          terraform_stack_prepare
          tf init -input=false -backend-config="bucket=$TF_BACKEND_BUCKET" -backend-config="key=$TF_BACKEND_KEY" -backend-config="region=$AWS_REGION"
          if ! tf plan -input=false -lock-timeout=5m -out=residual.tfplan >/dev/null 2>&1; then
            echo '::error::Read-only full residual plan failed; no apply was attempted.' >&2
            exit 1
          fi
          tf show -json residual.tfplan > "$TF_ROOT/residual.tfplan.json"
          test "$EXPECTED_RESIDUAL_SHA" = "$(python3 scripts/terraform-v2-bootstrap-policy.py residual "$REQUESTED_PHASE" "$TF_ROOT/residual.tfplan.json")"
          case "$REQUESTED_PHASE" in
            secret)
              targets=(
                -target=aws_secretsmanager_secret.runtime
                -target=aws_secretsmanager_secret.legacy_runtime
                -target=aws_secretsmanager_secret_version.runtime
                -target=aws_secretsmanager_secret_version.legacy_runtime
                -target=aws_secretsmanager_secret.app_runtime
                -target=aws_secretsmanager_secret_version.app_runtime
              )
              ;;
            host-policy) targets=(-target=aws_iam_user_policy.host_runtime) ;;
            *) exit 1 ;;
          esac
          test "$EXPECTED_MANIFEST_HMAC" = "$(python3 scripts/terraform-v2-bootstrap-policy.py manifest-hmac "$REQUESTED_PHASE" "${targets[@]}")"
          if ! tf plan -input=false -lock-timeout=5m -out=production.tfplan "${targets[@]}" >/dev/null 2>&1; then
            echo '::error::Exact targeted plan failed; no apply was attempted.' >&2
            exit 1
          fi
          tf show -json production.tfplan > "$TF_ROOT/production.tfplan.json"
          python3 scripts/terraform-v2-bootstrap-policy.py validate "$REQUESTED_PHASE" "$TF_ROOT/production.tfplan.json"
          tf show -no-color production.tfplan > "$TF_ROOT/production.tfplan.review.txt"
          test "$EXPECTED_REVIEW_SHA" = "$(sha256sum "$TF_ROOT/production.tfplan.review.txt" | awk '{print $1}')"
          test "$EXPECTED_SEMANTIC_HMAC" = "$(python3 scripts/terraform-plan-hmac.py "$TF_ROOT/production.tfplan.json")"
          test "$REQUESTED_SHA" = "$(gh api "/repos/${{ github.repository }}/git/ref/heads/main" --jq '.object.sha')"
          if ! tf apply -input=false -lock-timeout=5m -auto-approve production.tfplan >/dev/null 2>&1; then
            echo '::error::Targeted saved-plan apply failed; inspect production state before retry.' >&2
            exit 1
          fi
          if [[ "$REQUESTED_PHASE" == secret ]]; then
            aws secretsmanager get-secret-value \
              --secret-id /mycfc/production/app-runtime-secrets-v2 \
              --query SecretString --output text --no-cli-pager |
              python3 scripts/terraform-v2-bootstrap-policy.py live-secret-keys
          fi
          if ! tf plan -input=false -lock-timeout=5m -out=after.tfplan "${targets[@]}" >/dev/null 2>&1; then
            echo '::error::Targeted post-apply verification plan failed.' >&2
            exit 1
          fi
          tf show -json after.tfplan > "$TF_ROOT/after.tfplan.json"
          jq -e '[.resource_changes[]? | select(.mode == "managed" and .change.actions != ["no-op"])] | length == 0' "$TF_ROOT/after.tfplan.json" >/dev/null
          if ! tf plan -input=false -lock-timeout=5m -out=residual.tfplan >/dev/null 2>&1; then
            echo '::error::Read-only full residual post-plan failed.' >&2
            exit 1
          fi
          tf show -json residual.tfplan > "$TF_ROOT/residual.tfplan.json"
          test "$EXPECTED_RESIDUAL_SHA" = "$(python3 scripts/terraform-v2-bootstrap-policy.py residual "$REQUESTED_PHASE" "$TF_ROOT/residual.tfplan.json")"
          {
            printf "## One-time v2 bootstrap phase \`%s\` applied\n" "$REQUESTED_PHASE"
            echo
            echo "- Targeted plan fingerprint and keyed semantics: **matched approved plan**"
            echo "- Targeted post-plan: **no managed changes**"
            echo "- Read-only full residual address/action inventory: **matched fixed reviewed baseline before and after**"
            echo "- Residual resource semantics: **not attested by this inventory hash**"
            echo "- Un-targeted full plan: **never applied**"
          } >> "$GITHUB_STEP_SUMMARY"

name: Deploy production

on:
  workflow_run:
    workflows: [CI]
    branches: [main]
    types: [completed]
  workflow_dispatch:
    inputs:
      sha:
        description: Tested main-branch commit to deploy.
        required: true
        type: string

permissions:
  actions: read
  contents: read
  id-token: write

concurrency:
  group: mycfc-production-deploy
  cancel-in-progress: false

jobs:
  deploy:
    if: >-
      (github.event_name == 'workflow_run' && github.event.workflow_run.conclusion == 'success') ||
      github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-24.04
    environment: production
    env:
      AWS_REGION: ${{ vars.AWS_REGION }}
    steps:
      # actions/checkout v7.0.1
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.event_name == 'workflow_run' && github.event.workflow_run.head_sha || inputs.sha }}
          fetch-depth: 0
      - name: Verify a tested main commit
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -Eeuo pipefail
          SHA="${{ github.event_name == 'workflow_run' && github.event.workflow_run.head_sha || inputs.sha }}"
          git merge-base --is-ancestor "$SHA" origin/main
          test "$(git rev-parse HEAD)" = "$SHA"
          if [[ "${{ github.event_name }}" == workflow_dispatch ]]; then
            test -n "$(gh api "/repos/${{ github.repository }}/actions/runs?head_sha=$SHA&status=completed&per_page=100" \
              --jq '.workflow_runs[] | select(.name == "CI" and .conclusion == "success") | .id')"
          fi
      # aws-actions/configure-aws-credentials v6.2.3
      - uses: aws-actions/configure-aws-credentials@e6de054238d6b7531b4efff3b6587d9aade6a06c
        with:
          role-to-assume: ${{ vars.AWS_DEPLOY_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION }}
      - id: ecr-login
        # aws-actions/amazon-ecr-login v2.1.6
        uses: aws-actions/amazon-ecr-login@03f1aad4c6c7ffd436567f42f9384779290529bd
      - name: Prepare immutable image references
        id: image-refs
        env:
          ECR_REPOSITORY: ${{ steps.ecr-login.outputs.registry }}/mycfc-production
          ECR_REPOSITORY_NAME: mycfc-production
          GIT_SHA: ${{ github.event_name == 'workflow_run' && github.event.workflow_run.head_sha || inputs.sha }}
        run: sh deployment/publish-release-image.sh prepare
      # docker/setup-buildx-action v4.3.0
      - uses: docker/setup-buildx-action@37fe631027851001ddb9b187196cc803df7f5f0e
      - name: Build and publish immutable image tags
        id: build
        if: steps.image-refs.outputs.build_required == 'true'
        # docker/build-push-action v7.3.0
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a
        with:
          context: .
          push: true
          tags: |
            ${{ steps.image-refs.outputs.repository }}:${{ steps.image-refs.outputs.git_tag }}
          labels: |
            org.opencontainers.image.revision=${{ steps.image-refs.outputs.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          provenance: false
      - name: Prepare release promotion
        id: release-ref
        env:
          GIT_SHA: ${{ steps.image-refs.outputs.sha }}
        run: |
          set -Eeuo pipefail
          test "${#GIT_SHA}" -eq 40
          echo "release_tag=release-$(date -u +%Y%m%d%H%M%S)-$GIT_SHA" >> "$GITHUB_OUTPUT"
      - name: Verify and promote the immutable image
        id: image
        env:
          ECR_REPOSITORY: ${{ steps.image-refs.outputs.repository }}
          ECR_REPOSITORY_NAME: mycfc-production
          GIT_SHA: ${{ steps.image-refs.outputs.sha }}
          IMAGE_DIGEST: ${{ steps.build.outputs.digest || steps.image-refs.outputs.image_digest }}
          RELEASE_TAG: ${{ steps.release-ref.outputs.release_tag }}
        run: sh deployment/publish-release-image.sh
      - name: Promote the tested image for production pickup
        id: publication
        env:
          RELEASE_TAG: ${{ steps.image.outputs.release_tag }}
        run: |
          set -Eeuo pipefail
          test -n "$RELEASE_TAG"
          echo "published_at=$(date -u +%Y-%m-%dT%H:%M:%SZ)" >> "$GITHUB_OUTPUT"
      - name: Write deployment summary
        run: |
          {
            echo "## Production release published"
            echo
            echo "- SHA: \`${{ steps.image.outputs.sha }}\`"
            echo "- Image: \`${{ steps.image.outputs.image }}\`"
            echo "- Release tag: \`${{ steps.image.outputs.release_tag }}\`"
            echo "- Publication completed: \`${{ steps.publication.outputs.published_at }}\`"
            echo "- The Hetzner pull-release timer will deploy this immutable release."
          } >> "$GITHUB_STEP_SUMMARY"

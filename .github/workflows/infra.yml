name: Infrastructure

on:
  pull_request:
    paths: [infra/environments/hetzner/**]
  push:
    branches: [main]
    paths: [infra/environments/hetzner/**]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  checks:
    runs-on: ubuntu-24.04
    steps:
      # actions/checkout v7.0.1
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - name: Check Hetzner Terraform formatting
        run: docker run --rm -v "$PWD:/workspace" -w /workspace hashicorp/terraform:1.15.8 fmt -check infra/environments/hetzner
      - name: Validate Hetzner Terraform
        run: >-
          docker run --rm -v "$PWD:/workspace" -w /workspace hashicorp/terraform:1.15.8
          -chdir=infra/environments/hetzner init -backend=false
          && docker run --rm -v "$PWD:/workspace" -w /workspace hashicorp/terraform:1.15.8
          -chdir=infra/environments/hetzner validate

name: Terraform production plan
run-name: terraform ${{ inputs.stack || 'production' }} ${{ inputs.operation || 'plan' }} ${{ inputs.sha }}

on:
  workflow_dispatch:
    inputs:
      operation:
        description: Plan infrastructure or discover candidate AWS secret names only.
        type: choice
        required: true
        default: plan
        options:
          - plan
          - discover-inputs
      stack:
        description: Reviewed Terraform root to operate on.
        type: choice
        required: true
        default: production
        options:
          - production
          - hetzner
      sha:
        description: Exact current main-branch commit to plan.
        required: true
        type: string

permissions: {}

env:
  TERRAFORM_IMAGE: hashicorp/terraform:1.15.8@sha256:7ae513256f7ce67879e218ae8593d6fbe216ec9e123abe6c94e4e10704857963
  REQUESTED_OPERATION: ${{ inputs.operation || 'plan' }}
  REQUESTED_STACK: ${{ inputs.stack || 'production' }}
  TF_IN_AUTOMATION: 'true'
  TF_PLUGIN_CACHE_DIR: /terraform-plugin-cache

jobs:
  plan:
    runs-on: ubuntu-24.04
    environment: production-plan
    permissions:
      actions: read
      contents: read
      id-token: write
    concurrency:
      group: mycfc-production-infra-plan
      cancel-in-progress: false
    env:
      AWS_REGION: ${{ vars.AWS_REGION }}
      AWS_INFRA_PLAN_ROLE_ARN: ${{ vars.AWS_INFRA_PLAN_ROLE_ARN }}
      TF_BACKEND_BUCKET: ${{ vars.TF_BACKEND_BUCKET }}
    steps:
      # actions/checkout v7.0.1
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ inputs.sha }}
          fetch-depth: 0
          persist-credentials: false
      - name: Validate exact approved main commit
        env:
          GH_TOKEN: ${{ github.token }}
          REQUESTED_SHA: ${{ inputs.sha }}
          DISPATCH_REF: ${{ github.ref }}
          DISPATCH_SHA: ${{ github.sha }}
        run: |
          set -Eeuo pipefail
          preflight_fail() { echo "::error::Terraform preview preflight $1 failed" >&2; exit 1; }
          source scripts/terraform-stack.sh
          terraform_stack_select "$REQUESTED_STACK" || preflight_fail stack-selection
          terraform_preview_operation_select "$REQUESTED_OPERATION" || preflight_fail operation-selection
          [[ "$REQUESTED_SHA" =~ ^[0-9a-f]{40}$ ]] || preflight_fail sha-format
          test "$DISPATCH_REF" = refs/heads/main || preflight_fail dispatch-ref
          test "$REQUESTED_SHA" = "$DISPATCH_SHA" || preflight_fail dispatch-sha
          test -n "$AWS_REGION" || preflight_fail aws-region-configured
          test -n "$AWS_INFRA_PLAN_ROLE_ARN" || preflight_fail plan-role-configured
          test -n "$TF_BACKEND_BUCKET" || preflight_fail backend-bucket-configured
          main_sha=$(gh api "/repos/${{ github.repository }}/git/ref/heads/main" --jq '.object.sha' 2>/dev/null) || preflight_fail main-ref-read
          test "$REQUESTED_SHA" = "$main_sha" || preflight_fail current-main-sha
          test "$REQUESTED_SHA" = "$(git rev-parse HEAD)" || preflight_fail checkout-sha
          verified_commit=$(gh api "/repos/${{ github.repository }}/commits/$REQUESTED_SHA" \
            --jq 'select(.commit.verification.verified == true and .commit.verification.reason == "valid") | .sha' 2>/dev/null) || preflight_fail commit-read
          test "$verified_commit" = "$REQUESTED_SHA" || preflight_fail commit-signature
          ci_run=$(gh api "/repos/${{ github.repository }}/actions/workflows/ci.yml/runs?branch=main&event=push&status=completed&per_page=100" \
            --jq "([.workflow_runs[] | select(.head_sha == \"$REQUESTED_SHA\" and .head_branch == \"main\" and .event == \"push\" and .conclusion == \"success\")][0].id) // empty" 2>/dev/null) || preflight_fail ci-read
          test -n "$ci_run" || preflight_fail green-main-ci
      - name: Run credential-free Terraform checks
        if: inputs.operation != 'discover-inputs'
        run: make terraform-check
      # aws-actions/configure-aws-credentials v6.2.4
      - uses: aws-actions/configure-aws-credentials@e1253824e5c10ff9df46874f81ed3ec929e19cfd
        with:
          role-to-assume: ${{ vars.AWS_INFRA_PLAN_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION }}
      - name: Discover candidate AWS secret names
        if: inputs.operation == 'discover-inputs'
        run: bash scripts/discover-terraform-inputs.sh
      - name: Create the retained production plan
        if: inputs.operation != 'discover-inputs'
        env:
          STACK_TF_VARS: ${{ inputs.stack == 'hetzner' && secrets.HETZNER_TF_VARS || inputs.stack != 'hetzner' && secrets.TF_VARS || '' }}
          STACK_PROVIDER_TOKEN: ${{ inputs.stack == 'hetzner' && secrets.HCLOUD_TOKEN || inputs.stack != 'hetzner' && secrets.CLOUDFLARE_API_TOKEN || '' }}
          GH_TOKEN: ${{ github.token }}
          REQUESTED_SHA: ${{ inputs.sha }}
        run: |
          set -Eeuo pipefail
          source scripts/terraform-stack.sh
          terraform_stack_select "$REQUESTED_STACK"
          trap terraform_stack_cleanup EXIT
          terraform_stack_prepare
          tf init -input=false -backend-config="bucket=$TF_BACKEND_BUCKET" \
            -backend-config="key=$TF_BACKEND_KEY" -backend-config="region=$AWS_REGION"
          set +e
          tf plan -input=false -lock-timeout=5m -detailed-exitcode -out=production.tfplan
          plan_exit=$?
          set -e
          [[ "$plan_exit" == 0 || "$plan_exit" == 2 ]]
          tf show -json production.tfplan > "$TF_ROOT/production.tfplan.json"
          tf show -no-color production.tfplan | tee "$TF_ROOT/production.tfplan.review.txt"
          review_sha=$(sha256sum "$TF_ROOT/production.tfplan.review.txt" | awk '{print $1}')
          change_count=$(jq '[.resource_changes[]? | select(.change.actions != ["no-op"])] | length' \
            "$TF_ROOT/production.tfplan.json")
          policy_allowed=true
          if ! jq -e -f scripts/terraform-plan-policy.jq \
            "$TF_ROOT/production.tfplan.json" >/dev/null; then
            policy_allowed=false
          fi
          blocked_count=$(jq '[.resource_changes[]? | select(
              (.change.importing? != null) or
              ((.change.actions == ["no-op"] or .change.actions == ["create"] or
                .change.actions == ["read"] or .change.actions == ["update"]) | not)
            )] | length' \
            "$TF_ROOT/production.tfplan.json")
          main_sha=$(gh api "/repos/${{ github.repository }}/git/ref/heads/main" --jq '.object.sha')
          test "$REQUESTED_SHA" = "$main_sha"
          {
            echo "## $REQUESTED_STACK Terraform plan"
            echo
            echo "- Commit: \`$REQUESTED_SHA\`"
            echo "- Changed resources: **$change_count**"
            echo "- Blocked resource actions or imports: **$blocked_count**"
            echo "- Eligible for the normal apply policy: **$policy_allowed**"
            echo "- Redacted review fingerprint: \`$review_sha\`"
            echo
            echo '### Resource actions'
            jq -r '.resource_changes[]? | select(.change.actions != ["no-op"]) | "- `\(.address)`: `\(.change.actions | join(" → "))`"' \
              "$TF_ROOT/production.tfplan.json"
            echo
            echo 'The plan, plan JSON, and Terraform variables were not uploaded and were deleted on this runner.'
          } >> "$GITHUB_STEP_SUMMARY"

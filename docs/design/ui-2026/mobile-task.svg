<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="1200" viewBox="0 0 1000 1200" role="img" aria-labelledby="title desc">
<title id="title">MyCFC mobile full-height training task wireframe</title>
<desc id="desc">A mobile prescription editor with persistent context, scrollable fields and sticky actions.</desc>
<style>text{font-family:Inter,system-ui,sans-serif;fill:#14252d}.white{fill:#fff}.muted{fill:#5a6c72}.tiny{font-size:18px}.small{font-size:21px}.body{font-size:24px}.h2{font-size:34px;font-weight:800}.title{font-size:42px;font-weight:850}.field{fill:#fff;stroke:#8aa09b;stroke-width:2}.line{stroke:#cfdad7;stroke-width:2}</style>
<rect width="1000" height="1200" fill="#eef3f3"/><text x="80" y="85" class="title">Tarefa móvel de altura completa</text><text x="80" y="125" class="small muted">O contexto e as ações permanecem disponíveis com teclado virtual.</text>
<rect x="280" y="170" width="440" height="940" rx="46" fill="#0b2b3b"/>
<rect x="294" y="184" width="412" height="912" rx="36" fill="#fff"/>

name: Terraform production apply
run-name: terraform ${{ inputs.stack || 'production' }} apply ${{ inputs.sha }}

on:
  workflow_dispatch:
    inputs:
      stack:
        description: Reviewed Terraform root to operate on.
        type: choice
        required: true
        default: production
        options:
          - production
          - hetzner
      sha:
        description: Exact current main-branch commit to plan, approve, and apply.
        required: true
        type: string

permissions: {}

concurrency:
  group: mycfc-production-infra
  cancel-in-progress: false

env:
  TERRAFORM_IMAGE: hashicorp/terraform:1.15.8@sha256:7ae513256f7ce67879e218ae8593d6fbe216ec9e123abe6c94e4e10704857963
  REQUESTED_STACK: ${{ inputs.stack || 'production' }}
  TF_IN_AUTOMATION: 'true'
  TF_PLUGIN_CACHE_DIR: /terraform-plugin-cache

jobs:
  plan:
    runs-on: ubuntu-24.04
    environment: production-plan
    permissions:
      actions: read
      contents: read
      id-token: write
    outputs:
      review_sha: ${{ steps.plan.outputs.review_sha }}
      semantic_hmac: ${{ steps.plan.outputs.semantic_hmac }}
      semantic_components: ${{ steps.plan.outputs.semantic_components }}
    env:
      AWS_REGION: ${{ vars.AWS_REGION }}
      AWS_INFRA_PLAN_ROLE_ARN: ${{ vars.AWS_INFRA_PLAN_ROLE_ARN }}
      TF_BACKEND_BUCKET: ${{ vars.TF_BACKEND_BUCKET }}
    steps:
      # actions/checkout v7.0.1
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ inputs.sha }}
          fetch-depth: 0
          persist-credentials: false
      - name: Validate exact approved main commit
        env:
          GH_TOKEN: ${{ github.token }}
          REQUESTED_SHA: ${{ inputs.sha }}
          DISPATCH_REF: ${{ github.ref }}
          DISPATCH_SHA: ${{ github.sha }}
        run: |
          set -Eeuo pipefail
          source scripts/terraform-stack.sh
          terraform_stack_select "$REQUESTED_STACK"
          [[ "$REQUESTED_SHA" =~ ^[0-9a-f]{40}$ ]]
          test "$DISPATCH_REF" = refs/heads/main
          test "$REQUESTED_SHA" = "$DISPATCH_SHA"
          test -n "$AWS_REGION"
          test -n "$AWS_INFRA_PLAN_ROLE_ARN"
          test -n "$TF_BACKEND_BUCKET"
          test "$REQUESTED_SHA" = "$(git rev-parse HEAD)"
          main_sha=$(gh api "/repos/${{ github.repository }}/git/ref/heads/main" --jq '.object.sha')
          test "$REQUESTED_SHA" = "$main_sha"
          verified_commit=$(gh api "/repos/${{ github.repository }}/commits/$REQUESTED_SHA" \
            --jq 'select(.commit.verification.verified == true and .commit.verification.reason == "valid") | .sha')
          test "$verified_commit" = "$REQUESTED_SHA"
          ci_run=$(gh api "/repos/${{ github.repository }}/actions/workflows/ci.yml/runs?branch=main&event=push&status=completed&per_page=100" \
            --jq "([.workflow_runs[] | select(.head_sha == \"$REQUESTED_SHA\" and .head_branch == \"main\" and .event == \"push\" and .conclusion == \"success\")][0].id) // empty")
          test -n "$ci_run"
      - name: Run credential-free Terraform checks
        run: make terraform-check
      # aws-actions/configure-aws-credentials v6.2.4
      - uses: aws-actions/configure-aws-credentials@cbe3b392738ccf3f987d68400dafcf4b0624a56c
        with:
          role-to-assume: ${{ vars.AWS_INFRA_PLAN_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION }}
      - name: Create the plan for production approval
        id: plan
        env:
          STACK_TF_VARS: ${{ inputs.stack == 'hetzner' && secrets.HETZNER_TF_VARS || inputs.stack != 'hetzner' && secrets.TF_VARS || '' }}
          STACK_PROVIDER_TOKEN: ${{ inputs.stack == 'hetzner' && secrets.HCLOUD_TOKEN || inputs.stack != 'hetzner' && secrets.CLOUDFLARE_API_TOKEN || '' }}
          TF_PLAN_HMAC_KEY: ${{ secrets.TF_PLAN_HMAC_KEY }}
          GH_TOKEN: ${{ github.token }}
          REQUESTED_SHA: ${{ inputs.sha }}
        run: |
          set -Eeuo pipefail
          [[ "$TF_PLAN_HMAC_KEY" =~ ^[0-9a-f]{64}$ ]]
          source scripts/terraform-stack.sh
          terraform_stack_select "$REQUESTED_STACK"
          trap terraform_stack_cleanup EXIT
          terraform_stack_prepare
          tf init -input=false -backend-config="bucket=$TF_BACKEND_BUCKET" \
            -backend-config="key=$TF_BACKEND_KEY" -backend-config="region=$AWS_REGION"
          tf plan -input=false -lock-timeout=5m -out=production.tfplan
          tf show -json production.tfplan > "$TF_ROOT/production.tfplan.json"
          jq -e -f scripts/terraform-plan-policy.jq \
            "$TF_ROOT/production.tfplan.json" >/dev/null
          tf show -no-color production.tfplan | tee "$TF_ROOT/production.tfplan.review.txt"
          review_sha=$(sha256sum "$TF_ROOT/production.tfplan.review.txt" | awk '{print $1}')
          semantic_hmac=$(python3 scripts/terraform-plan-hmac.py \
            "$TF_ROOT/production.tfplan.json")
          semantic_components=$(python3 scripts/terraform-plan-hmac.py --components \
            "$TF_ROOT/production.tfplan.json")
          change_count=$(jq '[.resource_changes[]? | select(.change.actions != ["no-op"])] | length' \
            "$TF_ROOT/production.tfplan.json")
          main_sha=$(gh api "/repos/${{ github.repository }}/git/ref/heads/main" --jq '.object.sha')
          test "$REQUESTED_SHA" = "$main_sha"
          {
            echo "review_sha=$review_sha"
            echo "semantic_hmac=$semantic_hmac"
            echo "semantic_components=$semantic_components"
            echo "change_count=$change_count"
          } >> "$GITHUB_OUTPUT"
          {
            echo "## $REQUESTED_STACK Terraform awaiting approval"
            echo
            echo "- Commit: \`$REQUESTED_SHA\`"
            echo "- Changed resources: **$change_count**"
            echo "- Redacted review fingerprint: \`$review_sha\`"
            echo "- Protected semantic HMAC: \`$semantic_hmac\`"
            echo '- Normal apply policy: **passed**'
            echo
            echo 'Review the redacted plan in this job log before approving the dependent production job.'
          } >> "$GITHUB_STEP_SUMMARY"

  apply:
    needs: plan
    runs-on: ubuntu-24.04
    environment: production
    permissions:
      contents: read
      id-token: write
    env:
      AWS_REGION: ${{ vars.AWS_REGION }}
      AWS_INFRA_APPLY_ROLE_ARN: ${{ vars.AWS_INFRA_APPLY_ROLE_ARN }}
      TF_BACKEND_BUCKET: ${{ vars.TF_BACKEND_BUCKET }}
    steps:
      # actions/checkout v7.0.1
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ inputs.sha }}
          fetch-depth: 0
          persist-credentials: false
      - name: Revalidate approved commit and configuration
        env:
          GH_TOKEN: ${{ github.token }}
          REQUESTED_SHA: ${{ inputs.sha }}
          DISPATCH_REF: ${{ github.ref }}
          DISPATCH_SHA: ${{ github.sha }}
        run: |
          set -Eeuo pipefail
          source scripts/terraform-stack.sh
          terraform_stack_select "$REQUESTED_STACK"
          [[ "$REQUESTED_SHA" =~ ^[0-9a-f]{40}$ ]]
          test "$DISPATCH_REF" = refs/heads/main
          test "$REQUESTED_SHA" = "$DISPATCH_SHA"
          test "$REQUESTED_SHA" = "$(git rev-parse HEAD)"
          test -n "$AWS_REGION"
          test -n "$AWS_INFRA_APPLY_ROLE_ARN"
          test -n "$TF_BACKEND_BUCKET"
          test -n "${{ needs.plan.outputs.review_sha }}"
          main_sha=$(gh api "/repos/${{ github.repository }}/git/ref/heads/main" --jq '.object.sha')
          test "$REQUESTED_SHA" = "$main_sha"
      # aws-actions/configure-aws-credentials v6.2.4
      - uses: aws-actions/configure-aws-credentials@cbe3b392738ccf3f987d68400dafcf4b0624a56c
        with:
          role-to-assume: ${{ vars.AWS_INFRA_APPLY_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION }}
      - name: Recreate and apply the reviewed plan
        id: apply
        env:
          STACK_TF_VARS: ${{ inputs.stack == 'hetzner' && secrets.HETZNER_TF_VARS || inputs.stack != 'hetzner' && secrets.TF_VARS || '' }}
          STACK_PROVIDER_TOKEN: ${{ inputs.stack == 'hetzner' && secrets.HCLOUD_TOKEN || inputs.stack != 'hetzner' && secrets.CLOUDFLARE_API_TOKEN || '' }}
          TF_PLAN_HMAC_KEY: ${{ secrets.TF_PLAN_HMAC_KEY }}
          EXPECTED_REVIEW_SHA: ${{ needs.plan.outputs.review_sha }}
          EXPECTED_SEMANTIC_HMAC: ${{ needs.plan.outputs.semantic_hmac }}
          EXPECTED_SEMANTIC_COMPONENTS: ${{ needs.plan.outputs.semantic_components }}
          GH_TOKEN: ${{ github.token }}
          REQUESTED_SHA: ${{ inputs.sha }}
        run: |
          set -Eeuo pipefail
          [[ "$TF_PLAN_HMAC_KEY" =~ ^[0-9a-f]{64}$ ]]
          [[ "$EXPECTED_REVIEW_SHA" =~ ^[0-9a-f]{64}$ ]]
          [[ "$EXPECTED_SEMANTIC_HMAC" =~ ^[0-9a-f]{64}$ ]]
          jq -e 'type == "object" and length > 0 and all(.[]; test("^[0-9a-f]{64}$"))' \
            <<< "$EXPECTED_SEMANTIC_COMPONENTS" >/dev/null
          source scripts/terraform-stack.sh
          terraform_stack_select "$REQUESTED_STACK"
          trap terraform_stack_cleanup EXIT
          terraform_stack_prepare
          tf init -input=false -backend-config="bucket=$TF_BACKEND_BUCKET" \
            -backend-config="key=$TF_BACKEND_KEY" -backend-config="region=$AWS_REGION"
          tf plan -input=false -lock-timeout=5m -out=production.tfplan
          tf show -json production.tfplan > "$TF_ROOT/production.tfplan.json"
          jq -e -f scripts/terraform-plan-policy.jq \
            "$TF_ROOT/production.tfplan.json" >/dev/null
          tf show -no-color production.tfplan | tee "$TF_ROOT/production.tfplan.review.txt"
          review_sha=$(sha256sum "$TF_ROOT/production.tfplan.review.txt" | awk '{print $1}')
          semantic_hmac=$(python3 scripts/terraform-plan-hmac.py \
            "$TF_ROOT/production.tfplan.json")
          semantic_components=$(python3 scripts/terraform-plan-hmac.py --components \
            "$TF_ROOT/production.tfplan.json")
          if test "$review_sha" != "$EXPECTED_REVIEW_SHA"; then
            echo '::error::The recreated redacted plan does not match the human-reviewed plan.'
            exit 1
          fi
          if test "$semantic_hmac" != "$EXPECTED_SEMANTIC_HMAC"; then
            differing_components=$(jq -nr \
              --argjson expected "$EXPECTED_SEMANTIC_COMPONENTS" \
              --argjson actual "$semantic_components" \
              '((($expected | keys) + ($actual | keys)) | unique | map(select($expected[.] != $actual[.]))) | join(", ")')
            echo "::error::The recreated plan differs in protected semantic content after expected plan/apply role normalization. Differing top-level components: $differing_components"
            exit 1
          fi
          change_count=$(jq '[.resource_changes[]? | select(.change.actions != ["no-op"])] | length' \
            "$TF_ROOT/production.tfplan.json")
          main_sha=$(gh api "/repos/${{ github.repository }}/git/ref/heads/main" --jq '.object.sha')
          test "$REQUESTED_SHA" = "$main_sha"
          tf apply -input=false -lock-timeout=5m -auto-approve production.tfplan
          set +e
          tf plan -input=false -lock-timeout=5m -detailed-exitcode
          verify_exit=$?
          set -e
          test "$verify_exit" = 0
          observer_arn=
          if [[ "$REQUESTED_STACK" == production ]]; then
            observer_arn=$(tf output -raw operations_observer_role_arn 2>/dev/null || true)
          fi
          {
            echo "change_count=$change_count"
            echo "review_sha=$review_sha"
            echo "semantic_hmac=$semantic_hmac"
            echo "observer_role_arn=$observer_arn"
          } >> "$GITHUB_OUTPUT"
      - name: Record verified infrastructure application
        env:
          REQUESTED_SHA: ${{ inputs.sha }}
          CHANGE_COUNT: ${{ steps.apply.outputs.change_count }}
          REVIEW_SHA: ${{ steps.apply.outputs.review_sha }}
          SEMANTIC_HMAC: ${{ steps.apply.outputs.semantic_hmac }}
          OBSERVER_ROLE_ARN: ${{ steps.apply.outputs.observer_role_arn }}
        run: |
          {
            echo "## $REQUESTED_STACK Terraform applied"
            echo
            echo "- Commit: \`$REQUESTED_SHA\`"
            echo "- Changed resources: **$CHANGE_COUNT**"
            echo "- Matched reviewed fingerprint: \`$REVIEW_SHA\`"
            echo "- Matched protected semantic HMAC: \`$SEMANTIC_HMAC\`"
            echo '- Delete, replacement, forget, import, action, deferred, unknown, and provisioner operations: **0**'
            echo '- Allowed create/update semantics: **human-reviewed after plan generation**'
            echo '- Post-apply plan: **no changes**'
            if [[ -n "$OBSERVER_ROLE_ARN" ]]; then
              echo "- Operations observer role: \`$OBSERVER_ROLE_ARN\`"
            fi
          } >> "$GITHUB_STEP_SUMMARY"

<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="900" viewBox="0 0 1440 900" role="img" aria-labelledby="title desc">
<title id="title">MyCFC members collection with modal side-sheet creation task</title>
<desc id="desc">Desktop application shell, member collection, dimmed background and a contained create-account side sheet.</desc>

version: "2"
sql:
  - engine: "postgresql"
    schema: "internal/db/schema.sql"
    queries: "internal/db/queries"
    gen:
      go:
        package: "dbgen"
        out: "internal/db/generated"
        sql_package: "pgx/v5"
        emit_interface: true
        emit_json_tags: true
        emit_empty_slices: true
        emit_pointers_for_null_types: true
        overrides:
          - db_type: "consent_type"
            go_type:
              type: "string"
          - db_type: "repair_status"
            go_type:
              type: "string"
          - db_type: "equipment_type"
            go_type:
              type: "string"
          - db_type: "equipment_status"
            go_type:
              type: "string"
          - db_type: "maintenance_status"
            go_type:
              type: "string"
          - db_type: "metric_type"
            go_type:
              type: "string"
          - db_type: "medical_declaration"
            go_type:
              type: "string"
          - db_type: "uuid"
            go_type:
              import: "github.com/google/uuid"
              type: "UUID"
          - db_type: "uuid"
            nullable: true
            go_type:
              import: "github.com/google/uuid"
              type: "UUID"
              pointer: true

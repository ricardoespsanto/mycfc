name: Deploy production

on:
  workflow_run:
    workflows: [CI]
    branches: [main]
    types: [completed]
  workflow_dispatch:
    inputs:
      sha:
        description: Tested main-branch commit to deploy.
        required: true
        type: string

permissions:
  actions: read
  contents: read
  id-token: write

concurrency:
  group: mycfc-production-deploy
  cancel-in-progress: false

jobs:
  deploy:
    if: >-
      (github.event_name == 'workflow_run' && github.event.workflow_run.conclusion == 'success') ||
      github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-24.04
    environment: production
    env:
      AWS_REGION: ${{ vars.AWS_REGION }}
      TF_BACKEND_BUCKET: ${{ vars.TF_BACKEND_BUCKET }}
      TF_VARS: ${{ secrets.TF_VARS }}
    steps:
      # actions/checkout v4.2.2
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: ${{ github.event_name == 'workflow_run' && github.event.workflow_run.head_sha || inputs.sha }}
          fetch-depth: 0
      - name: Verify a tested main commit
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -Eeuo pipefail
          SHA="${{ github.event_name == 'workflow_run' && github.event.workflow_run.head_sha || inputs.sha }}"
          git merge-base --is-ancestor "$SHA" origin/main
          test "$(git rev-parse HEAD)" = "$SHA"
          if [[ "${{ github.event_name }}" == workflow_dispatch ]]; then
            test -n "$(gh api \"/repos/${{ github.repository }}/actions/runs?head_sha=$SHA&status=completed&per_page=100\" \
              --jq '.workflow_runs[] | select(.name == "CI" and .conclusion == "success") | .id')"
          fi
      # aws-actions/configure-aws-credentials v6.2.3
      - uses: aws-actions/configure-aws-credentials@e6de054238d6b7531b4efff3b6587d9aade6a06c
        with:
          role-to-assume: ${{ vars.AWS_DEPLOY_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION }}
      - id: ecr-login
        # aws-actions/amazon-ecr-login v2.0.1
        uses: aws-actions/amazon-ecr-login@d539f0932e70871a027e9d5a9d8fc38589180a64
      - name: Resolve deployment identifiers from Terraform state
        id: terraform
        run: |
          set -Eeuo pipefail
          umask 077
          printf '%s' "$TF_VARS" > infra/environments/production/ci.auto.tfvars
          docker run --rm --user "$(id -u):$(id -g)" -v "$PWD:/workspace" -w /workspace \
            -e AWS_ACCESS_KEY_ID -e AWS_SECRET_ACCESS_KEY -e AWS_SESSION_TOKEN -e AWS_REGION \
            hashicorp/terraform:1.15.8 -chdir=infra/environments/production init \
            -backend-config="bucket=$TF_BACKEND_BUCKET" -backend-config="region=$AWS_REGION"
          terraform_output="$RUNNER_TEMP/terraform-outputs.json"
          docker run --rm --user "$(id -u):$(id -g)" -v "$PWD:/workspace" -w /workspace \
            -e AWS_ACCESS_KEY_ID -e AWS_SECRET_ACCESS_KEY -e AWS_SESSION_TOKEN -e AWS_REGION \
            hashicorp/terraform:1.15.8 -chdir=infra/environments/production output -json > "$terraform_output"

          # These deployment-critical identifiers must come from Terraform state, not guesses.
          required_outputs=(
            ecr_repository_url
            ecs_cluster_name
            ecs_service_name
            app_task_definition_arn
            bootstrap_task_definition_arn
            migration_task_definition_arn
            domain_name
            app_private_subnet_ids
            task_security_group_id
          )
          missing_outputs=()
          for output in "${required_outputs[@]}"; do
            if ! jq -e --arg output "$output" 'has($output) and (.[$output].sensitive | not)' "$terraform_output" >/dev/null; then
              missing_outputs+=("$output")
            fi
          done
          if ((${#missing_outputs[@]})); then
            printf 'Production Terraform state is missing required non-sensitive deployment outputs: %s\n' "${missing_outputs[*]}" >&2
            exit 1
          fi
          if ! jq -e '.app_private_subnet_ids.value | type == "array" and length > 0 and all(.[]; type == "string" and length > 0)' "$terraform_output" >/dev/null; then
            echo "Production Terraform output app_private_subnet_ids must be a non-empty list of subnet IDs." >&2
            exit 1
          fi

          for output in ecr_repository_url ecs_cluster_name ecs_service_name app_task_definition_arn bootstrap_task_definition_arn migration_task_definition_arn domain_name task_security_group_id; do
            printf '%s=%s\n' "$output" "$(jq -r --arg output "$output" '.[$output].value' "$terraform_output")" >> "$GITHUB_OUTPUT"
          done
          printf 'app_private_subnet_ids=%s\n' "$(jq -c '.app_private_subnet_ids.value' "$terraform_output")" >> "$GITHUB_OUTPUT"
      - name: Build and push the immutable image
        id: image
        run: |
          set -Eeuo pipefail
          SHA="$(git rev-parse HEAD)"
          REPOSITORY="${{ steps.terraform.outputs.ecr_repository_url }}"
          IMAGE="$REPOSITORY:git-$SHA"
          docker build --label "org.opencontainers.image.revision=$SHA" -t "$IMAGE" .
          docker push "$IMAGE"
          DIGEST="$(aws ecr describe-images --repository-name "${REPOSITORY#*/}" --image-ids imageTag="git-$SHA" --query 'imageDetails[0].imageDigest' --output text)"
          printf 'image=%s@%s\nsha=%s\n' "$REPOSITORY" "$DIGEST" "$SHA" >> "$GITHUB_OUTPUT"
      - name: Register immutable ECS task definitions
        id: task-definitions
        run: |
          set -Eeuo pipefail
          app_current="$RUNNER_TEMP/app-task-definition.json"
          app_registration="$RUNNER_TEMP/app-task-registration.json"

          aws ecs describe-task-definition \
            --task-definition "${{ steps.terraform.outputs.app_task_definition_arn }}" \
            --query taskDefinition --output json > "$app_current"

          # ECS rejects describe-only fields. Preserve all operational settings and alter only release values.
          jq --arg image "${{ steps.image.outputs.image }}" --arg sha "${{ steps.image.outputs.sha }}" '
            def release_env($name; $value):
              .environment = ((.environment // [] | map(select(.name != $name))) + [{name: $name, value: $value}]);
            del(.taskDefinitionArn, .revision, .status, .requiresAttributes, .compatibilities, .registeredAt, .registeredBy, .deregisteredAt)
            | if any(.containerDefinitions[]; .name == "app") then
                .containerDefinitions |= map(
                  if .name == "app" then
                    .image = $image
                    | del(.healthCheck)
                    | release_env("APP_VERSION"; $sha)
                    | release_env("GIT_SHA"; $sha)
                  else . end
                )
              else error("app task definition has no app container") end
          ' "$app_current" > "$app_registration"
          app_task_definition="$(aws ecs register-task-definition --cli-input-json "file://$app_registration" --query 'taskDefinition.taskDefinitionArn' --output text)"
          printf 'app_task_definition=%s\n' "$app_task_definition" >> "$GITHUB_OUTPUT"
          for task in bootstrap migration; do
            current="$RUNNER_TEMP/$task-task-definition.json"
            registration="$RUNNER_TEMP/$task-task-registration.json"
            if [[ "$task" == bootstrap ]]; then
              task_definition="${{ steps.terraform.outputs.bootstrap_task_definition_arn }}"
            else
              task_definition="${{ steps.terraform.outputs.migration_task_definition_arn }}"
            fi
            aws ecs describe-task-definition --task-definition "$task_definition" --query taskDefinition --output json > "$current"
            jq --arg image "${{ steps.image.outputs.image }}" '
              del(.taskDefinitionArn, .revision, .status, .requiresAttributes, .compatibilities, .registeredAt, .registeredBy, .deregisteredAt)
              | .containerDefinitions |= map(.image = $image)
            ' "$current" > "$registration"
            registered="$(aws ecs register-task-definition --cli-input-json "file://$registration" --query 'taskDefinition.taskDefinitionArn' --output text)"
            printf '%s_task_definition=%s\n' "$task" "$registered" >> "$GITHUB_OUTPUT"
          done
      - name: Bootstrap database roles and apply the reset baseline
        env:
          CLUSTER: ${{ steps.terraform.outputs.ecs_cluster_name }}
          BOOTSTRAP_TASK_DEFINITION: ${{ steps.task-definitions.outputs.bootstrap_task_definition }}
          MIGRATION_TASK_DEFINITION: ${{ steps.task-definitions.outputs.migration_task_definition }}
          SUBNETS: ${{ steps.terraform.outputs.app_private_subnet_ids }}
          SECURITY_GROUP: ${{ steps.terraform.outputs.task_security_group_id }}
        run: |
          set -Eeuo pipefail
          network_configuration="$(jq -cn --argjson subnets "$SUBNETS" --arg security_group "$SECURITY_GROUP" '{awsvpcConfiguration:{subnets:$subnets,securityGroups:[$security_group],assignPublicIp:"DISABLED"}}')"
          run_and_wait() {
            local task_definition="$1"
            local task_arn status
            task_arn="$(aws ecs run-task --cluster "$CLUSTER" --task-definition "$task_definition" --launch-type FARGATE --network-configuration "$network_configuration" --query 'tasks[0].taskArn' --output text)"
            test "$task_arn" != "None"
            for attempt in {1..80}; do
              status="$(aws ecs describe-tasks --cluster "$CLUSTER" --tasks "$task_arn" --query 'tasks[0].lastStatus' --output text)"
              [[ "$status" == "STOPPED" ]] && break
              sleep 5
            done
            [[ "$status" == "STOPPED" ]]
            aws ecs describe-tasks --cluster "$CLUSTER" --tasks "$task_arn" --query 'tasks[0].containers[0] | {name: name, exitCode: exitCode, reason: reason}' --output json
            [[ "$(aws ecs describe-tasks --cluster "$CLUSTER" --tasks "$task_arn" --query 'tasks[0].containers[0].exitCode' --output text)" == "0" ]]
          }
          run_and_wait "$BOOTSTRAP_TASK_DEFINITION"
          run_and_wait "$MIGRATION_TASK_DEFINITION"
      - name: Update ECS service and wait for a healthy deployment
        timeout-minutes: 10
        env:
          CLUSTER: ${{ steps.terraform.outputs.ecs_cluster_name }}
          SERVICE: ${{ steps.terraform.outputs.ecs_service_name }}
          TASK_DEFINITION: ${{ steps.task-definitions.outputs.app_task_definition }}
        run: |
          set -Eeuo pipefail
          aws ecs update-service --cluster "$CLUSTER" --service "$SERVICE" --task-definition "$TASK_DEFINITION" --force-new-deployment >/dev/null
          service_description="$RUNNER_TEMP/service.json"
          deployment_healthy=false
          for attempt in {1..36}; do
            aws ecs describe-services --cluster "$CLUSTER" --services "$SERVICE" --output json > "$service_description"
            rollout_state="$(jq -r --arg task_definition "$TASK_DEFINITION" '
              [.services[0].deployments[] | select(.status == "PRIMARY" and .taskDefinition == $task_definition)][0].rolloutState // "PENDING"
            ' "$service_description")"
            jq -r --argjson attempt "$attempt" --arg task_definition "$TASK_DEFINITION" --arg rollout_state "$rollout_state" '
              .services[0] |
              "ECS rollout poll \($attempt)/36: state=\($rollout_state) running=\(.runningCount)/\(.desiredCount) pending=\(.pendingCount) task=\($task_definition)"
            ' "$service_description"
            if [[ "$rollout_state" == "FAILED" ]]; then
              jq -c --arg task_definition "$TASK_DEFINITION" '.services[0] | {
                status, runningCount, desiredCount, pendingCount,
                deployment: [.deployments[] | select(.taskDefinition == $task_definition) | {status, taskDefinition, rolloutState, rolloutStateReason}][0],
                events: [.events[0:10][] | {createdAt, message}]
              }' "$service_description" >&2
              exit 1
            fi
            if jq -e --arg task_definition "$TASK_DEFINITION" '
              .services[0] |
              .runningCount == .desiredCount and .pendingCount == 0 and
              ([.deployments[] | select(.status == "PRIMARY" and .taskDefinition == $task_definition and .rolloutState == "COMPLETED")] | length == 1)
            ' "$service_description" >/dev/null; then
              deployment_healthy=true
              break
            fi
            sleep 15
          done
          if [[ "$deployment_healthy" != true ]]; then
            jq -c '.services[0] | {
              status, runningCount, desiredCount, pendingCount,
              deployments: [.deployments[] | {status, taskDefinition, rolloutState, rolloutStateReason}],
              events: [.events[0:10][] | {createdAt, message}]
            }' "$service_description" >&2
            echo "ECS deployment did not become healthy within 9 minutes." >&2
            exit 1
          fi
      - name: Smoke test production endpoints
        env:
          DOMAIN: ${{ steps.terraform.outputs.domain_name }}
        run: |
          set -Eeuo pipefail
          asset_path="$(jq -r '."app.js"' ui/static/dist/manifest.json)"
          for attempt in {1..20}; do
            health="$(curl --silent --show-error --output /dev/null --write-out '%{http_code}' --max-time 10 "https://$DOMAIN/health/ready" || true)"
            login="$(curl --silent --show-error --output /dev/null --write-out '%{http_code}' --max-time 10 "https://$DOMAIN/login" || true)"
            asset="$(curl --silent --show-error --output /dev/null --write-out '%{http_code}' --max-time 10 "https://$DOMAIN$asset_path" || true)"
            if [[ "$health" == 200 && "$login" == 200 && "$asset" == 200 ]]; then
              exit 0
            fi
            sleep 15
          done
          printf 'Smoke checks failed: health=%s login=%s static_asset=%s\n' "$health" "$login" "$asset" >&2
          exit 1
      - name: Write deployment summary
        run: |
          set -Eeuo pipefail
          {
            echo "## Production deployment"
            echo
            echo "- SHA: \`${{ steps.image.outputs.sha }}\`"
            echo "- Image: \`${{ steps.image.outputs.image }}\`"
            echo "- App task definition: \`${{ steps.task-definitions.outputs.app_task_definition }}\`"
          } >> "$GITHUB_STEP_SUMMARY"
      - if: always()
        run: rm -f infra/environments/production/ci.auto.tfvars infra/environments/production/production.tfplan "$RUNNER_TEMP"/{terraform-outputs,app-task-definition,app-task-registration,service}.json

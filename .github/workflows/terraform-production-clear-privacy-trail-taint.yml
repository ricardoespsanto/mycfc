name: Clear privacy-trail Terraform taint
run-name: clear privacy-trail Terraform taint ${{ inputs.sha }}

on:
  workflow_dispatch:
    inputs:
      sha:
        description: Exact current main-branch commit whose production plan shows the stale trail replacement.
        required: true
        type: string

permissions: {}

concurrency:
  group: mycfc-production-infra
  cancel-in-progress: false

env:
  TERRAFORM_IMAGE: hashicorp/terraform:1.15.8@sha256:7ae513256f7ce67879e218ae8593d6fbe216ec9e123abe6c94e4e10704857963
  TF_IN_AUTOMATION: 'true'
  TF_PLUGIN_CACHE_DIR: /terraform-plugin-cache
  REQUESTED_SHA: ${{ inputs.sha }}
  TARGET_ADDRESS: aws_cloudtrail.privacy_activation_exchange[0]

jobs:
  review:
    runs-on: ubuntu-24.04
    environment: production-plan
    permissions:
      actions: read
      contents: read
      id-token: write
    env:
      AWS_REGION: ${{ vars.AWS_REGION }}
      AWS_INFRA_PLAN_ROLE_ARN: ${{ vars.AWS_INFRA_PLAN_ROLE_ARN }}
      TF_BACKEND_BUCKET: ${{ vars.TF_BACKEND_BUCKET }}
    steps:
      # actions/checkout v7.0.1
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ inputs.sha }}
          fetch-depth: 0
          persist-credentials: false
      - name: Validate exact approved main commit
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -Eeuo pipefail
          [[ "$REQUESTED_SHA" =~ ^[0-9a-f]{40}$ ]]
          test "$GITHUB_REF" = refs/heads/main
          test "$REQUESTED_SHA" = "$GITHUB_SHA"
          test "$REQUESTED_SHA" = "$(git rev-parse HEAD)"
          main_sha=$(gh api "/repos/${{ github.repository }}/git/ref/heads/main" --jq '.object.sha')
          test "$REQUESTED_SHA" = "$main_sha"
          gh api "/repos/${{ github.repository }}/commits/$REQUESTED_SHA" --jq 'select(.commit.verification.verified and .commit.verification.reason == "valid") | .sha' | grep -Fx "$REQUESTED_SHA"
      - name: Run credential-free Terraform checks
        run: make terraform-check
      # aws-actions/configure-aws-credentials v6.2.4
      - uses: aws-actions/configure-aws-credentials@cbe3b392738ccf3f987d68400dafcf4b0624a56c
        with:
          role-to-assume: ${{ vars.AWS_INFRA_PLAN_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION }}
      - name: Verify the sole blocked action is the stale trail replacement
        env:
          STACK_TF_VARS: ${{ secrets.TF_VARS }}
          STACK_PROVIDER_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          set -Eeuo pipefail
          source scripts/terraform-stack.sh
          terraform_stack_select production
          trap terraform_stack_cleanup EXIT
          terraform_stack_prepare
          tf init -input=false -backend-config="bucket=$TF_BACKEND_BUCKET" -backend-config="key=$TF_BACKEND_KEY" -backend-config="region=$AWS_REGION"
          tf plan -input=false -lock-timeout=5m -out=recovery.tfplan
          tf show -json recovery.tfplan > "$TF_ROOT/recovery.tfplan.json"
          jq -e --arg target "$TARGET_ADDRESS" '
            [.resource_changes[]? | select(.change.actions != ["no-op"] and .change.actions != ["create"] and .change.actions != ["read"] and .change.actions != ["update"])] as $blocked |
            ($blocked | length) == 1 and $blocked[0].address == $target and $blocked[0].change.actions == ["delete", "create"]
          ' "$TF_ROOT/recovery.tfplan.json" >/dev/null
          echo "## Stale Terraform taint verified" >> "$GITHUB_STEP_SUMMARY"
          echo "- Commit: \`$REQUESTED_SHA\`" >> "$GITHUB_STEP_SUMMARY"
          echo "- Recovery changes state only; it does not create, update, or delete a cloud resource." >> "$GITHUB_STEP_SUMMARY"

  clear:
    needs: review
    runs-on: ubuntu-24.04
    environment: production
    permissions:
      contents: read
      id-token: write
    env:
      AWS_REGION: ${{ vars.AWS_REGION }}
      AWS_INFRA_APPLY_ROLE_ARN: ${{ vars.AWS_INFRA_APPLY_ROLE_ARN }}
      TF_BACKEND_BUCKET: ${{ vars.TF_BACKEND_BUCKET }}
    steps:
      # actions/checkout v7.0.1
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ inputs.sha }}
          fetch-depth: 0
          persist-credentials: false
      # aws-actions/configure-aws-credentials v6.2.4
      - uses: aws-actions/configure-aws-credentials@cbe3b392738ccf3f987d68400dafcf4b0624a56c
        with:
          role-to-assume: ${{ vars.AWS_INFRA_APPLY_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION }}
      - name: Clear only the verified stale trail taint
        env:
          STACK_TF_VARS: ${{ secrets.TF_VARS }}
          STACK_PROVIDER_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          set -Eeuo pipefail
          source scripts/terraform-stack.sh
          terraform_stack_select production
          trap terraform_stack_cleanup EXIT
          terraform_stack_prepare
          tf init -input=false -backend-config="bucket=$TF_BACKEND_BUCKET" -backend-config="key=$TF_BACKEND_KEY" -backend-config="region=$AWS_REGION"
          tf plan -input=false -lock-timeout=5m -out=before.tfplan
          tf show -json before.tfplan > "$TF_ROOT/before.tfplan.json"
          jq -e --arg target "$TARGET_ADDRESS" '
            [.resource_changes[]? | select(.change.actions != ["no-op"] and .change.actions != ["create"] and .change.actions != ["read"] and .change.actions != ["update"])] as $blocked |
            ($blocked | length) == 1 and $blocked[0].address == $target and $blocked[0].change.actions == ["delete", "create"]
          ' "$TF_ROOT/before.tfplan.json" >/dev/null
          tf untaint "$TARGET_ADDRESS"
          tf plan -input=false -lock-timeout=5m -out=after.tfplan
          tf show -json after.tfplan > "$TF_ROOT/after.tfplan.json"
          jq -e -f scripts/terraform-plan-policy.jq "$TF_ROOT/after.tfplan.json" >/dev/null
          echo "## Stale Terraform taint cleared" >> "$GITHUB_STEP_SUMMARY"
          echo "- Commit: \`$REQUESTED_SHA\`" >> "$GITHUB_STEP_SUMMARY"
          echo "- Verified follow-up plan has no delete or replacement actions." >> "$GITHUB_STEP_SUMMARY"

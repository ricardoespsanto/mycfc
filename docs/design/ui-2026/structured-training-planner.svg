<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="900" viewBox="0 0 1440 900" role="img" aria-labelledby="title desc">
<title id="title">MyCFC structured-training planner desktop wireframe</title>
<desc id="desc">A stable group and week context surrounds a day outline, session list and selected-session inspector.</desc>
<style>text{font-family:Inter,system-ui,sans-serif;fill:#14252d}.white{fill:#fff}.muted{fill:#5a6c72}.tiny{font-size:14px}.small{font-size:16px}.body{font-size:18px}.h3{font-size:21px;font-weight:800}.h2{font-size:28px;font-weight:800}.h1{font-size:39px;font-weight:850}.nav{font-size:17px;fill:#fff}.card{fill:#fff;stroke:#cfdad7;stroke-width:2}.line{stroke:#cfdad7;stroke-width:2}</style>
<rect width="1440" height="900" fill="#f6f8f8"/><rect width="238" height="900" fill="#0b2b3b"/>
<text x="30" y="56" font-size="27" font-weight="850" class="white">MyCFC</text><circle cx="58" cy="116" r="25" fill="#dcefeb"/><text x="43" y="123" font-size="16" font-weight="800">TT</text><text x="96" y="112" class="nav">Tiago Treinador</text><text x="96" y="137" class="tiny" fill="#bcd0d3">Competição · Treinador</text>
<text x="30" y="200" class="tiny" fill="#88a5ab">TREINOS</text><rect x="18" y="218" width="202" height="46" rx="8" fill="#ffffff22"/><text x="40" y="248" class="nav" font-weight="800">Plano</text><text x="40" y="298" class="nav">Variações</text><text x="40" y="340" class="nav">Publicação</text><text x="40" y="382" class="nav">Biblioteca</text><text x="40" y="424" class="nav">Definições</text>
<rect x="238" width="1202" height="62" class="white"/><text x="274" y="38" class="small muted">Treinos / Velocidade Sénior / Semana 34</text><rect x="602" y="17" width="90" height="30" rx="15" fill="#fff0cd"/><text x="622" y="38" class="tiny" font-weight="800">Rascunho</text>
<text x="274" y="116" class="tiny" fill="#0d7d7a" font-weight="800">VELOCIDADE SÉNIOR</text><text x="274" y="162" class="h1">19–25 agosto</text><text x="274" y="194" class="body muted">O grupo, a semana e o estado permanecem visíveis durante o planeamento.</text><rect x="1196" y="114" width="190" height="50" rx="9" fill="#0d7d7a"/><text x="1228" y="146" class="body white" font-weight="800">Publicar semana</text>
<rect x="274" y="236" width="1112" height="564" rx="14" class="card"/>
<rect x="274" y="236" width="196" height="564" rx="14" fill="#eef3f3"/><line x1="470" y1="236" x2="470" y2="800" class="line"/>
<text x="298" y="276" class="h3">Dias</text><text x="298" y="314" class="small muted">Segunda-feira · 2</text><rect x="286" y="334" width="172" height="54" rx="9" fill="#dcefeb"/><text x="302" y="367" class="body" font-weight="800">Terça-feira · 3</text><text x="298" y="425" class="small muted">Quarta-feira · 1</text><text x="298" y="469" class="small muted">Quinta-feira · 2</text><text x="298" y="513" class="small muted">Sexta-feira · 1</text>
<text x="504" y="276" class="h2">Terça-feira, 20 agosto</text><text x="504" y="310" class="small muted">3 sessões · 210 minutos planeados</text>
<rect x="500" y="340" width="505" height="144" rx="12" fill="#fff" stroke="#0d7d7a" stroke-width="3"/><rect x="500" y="340" width="8" height="144" fill="#0d7d7a"/><text x="528" y="374" class="tiny muted">07:00 · ÁGUA · 90 MIN</text><text x="528" y="409" class="h3">Velocidade específica K1</text><text x="528" y="442" class="body">4 × 500 m R5 · recuperação 4 min</text><rect x="878" y="364" width="96" height="40" rx="8" fill="#eef3f3"/><text x="904" y="390" class="small" font-weight="800">Abrir</text>
<rect x="500" y="502" width="505" height="126" rx="12" class="card"/><text x="528" y="536" class="tiny muted">18:30 · GINÁSIO · 60 MIN</text><text x="528" y="571" class="h3">Força máxima</text><text x="528" y="602" class="body">Agachamento, puxada e estabilidade</text>
<rect x="500" y="652" width="172" height="48" rx="9" fill="#fff" stroke="#0d7d7a" stroke-width="2"/><text x="527" y="682" class="small" fill="#0d7d7a" font-weight="800">Adicionar sessão</text>
<rect x="1034" y="236" width="352" height="564" rx="14" fill="#eef3f3"/><line x1="1034" y1="236" x2="1034" y2="800" class="line"/>
<text x="1062" y="275" class="tiny muted">SESSÃO SELECIONADA</text><text x="1062" y="315" class="h2">Velocidade específica K1</text><text x="1062" y="356" class="body">3 segmentos</text><text x="1062" y="386" class="small muted">Água · Mobilidade · Retorno à calma</text>
<rect x="1062" y="432" width="296" height="50" rx="9" fill="#0d7d7a"/><text x="1127" y="464" class="body white" font-weight="800">Editar prescrição</text>
<rect x="1062" y="498" width="296" height="48" rx="9" fill="#fff" stroke="#cfdad7" stroke-width="2"/><text x="1126" y="529" class="small" font-weight="800">Adicionar segmento</text>
<rect x="1062" y="562" width="296" height="48" rx="9" fill="#fff" stroke="#cfdad7" stroke-width="2"/><text x="1160" y="593" class="small" font-weight="800">Mais ações</text>
<rect x="1062" y="650" width="296" height="98" rx="9" fill="#fff0cd"/><rect x="1062" y="650" width="6" height="98" fill="#e39a13"/><text x="1084" y="680" class="small">Copiar e guardar rotina vivem</text><text x="1084" y="706" class="small">no contexto do objeto.</text><text x="1084" y="732" class="tiny muted">Não são um separador global.</text>
<text x="274" y="848" class="small muted">Mobile: seletor horizontal de dias → lista cronológica → detalhe da sessão → tarefa de edição em altura completa.</text>
</svg>
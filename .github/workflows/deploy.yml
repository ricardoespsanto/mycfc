name: Deploy production

on:
  workflow_run:
    workflows: [CI]
    branches: [main]
    types: [completed]
  workflow_dispatch:
    inputs:
      sha:
        description: Tested main-branch commit to deploy.
        required: true
        type: string

permissions:
  actions: read
  contents: read
  id-token: write

concurrency:
  group: mycfc-production-deploy
  cancel-in-progress: false

jobs:
  deploy:
    if: >-
      (github.event_name == 'workflow_run' && github.event.workflow_run.conclusion == 'success') ||
      github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-24.04
    environment: production
    env:
      AWS_REGION: ${{ vars.AWS_REGION }}
    steps:
      # actions/checkout v7.0.1
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.event_name == 'workflow_run' && github.event.workflow_run.head_sha || inputs.sha }}
          fetch-depth: 0
      - name: Verify a tested main commit
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -Eeuo pipefail
          SHA="${{ github.event_name == 'workflow_run' && github.event.workflow_run.head_sha || inputs.sha }}"
          git merge-base --is-ancestor "$SHA" origin/main
          test "$(git rev-parse HEAD)" = "$SHA"
          if [[ "${{ github.event_name }}" == workflow_dispatch ]]; then
            test -n "$(gh api "/repos/${{ github.repository }}/actions/runs?head_sha=$SHA&status=completed&per_page=100" \
              --jq '.workflow_runs[] | select(.name == "CI" and .conclusion == "success") | .id')"
          fi
      # aws-actions/configure-aws-credentials v6.2.3
      - uses: aws-actions/configure-aws-credentials@e6de054238d6b7531b4efff3b6587d9aade6a06c
        with:
          role-to-assume: ${{ vars.AWS_DEPLOY_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION }}
      - id: ecr-login
        # aws-actions/amazon-ecr-login v2.1.6
        uses: aws-actions/amazon-ecr-login@d539f0932e70871a027e9d5a9d8fc38589180a64
      - name: Build and push the immutable image
        id: image
        run: |
          set -Eeuo pipefail
          SHA="$(git rev-parse HEAD)"
          ACCOUNT_ID="$(aws sts get-caller-identity --query Account --output text)"
          REPOSITORY="$ACCOUNT_ID.dkr.ecr.$AWS_REGION.amazonaws.com/mycfc-production"
          IMAGE="$REPOSITORY:git-$SHA"
          docker build --label "org.opencontainers.image.revision=$SHA" -t "$IMAGE" .
          docker push "$IMAGE"
          DIGEST="$(aws ecr describe-images --repository-name mycfc-production --image-ids imageTag="git-$SHA" --query 'imageDetails[0].imageDigest' --output text)"
          printf 'image=%s@%s\nregistry=%s\nsha=%s\n' "$REPOSITORY" "$DIGEST" "${REPOSITORY%%/*}" "$SHA" >> "$GITHUB_OUTPUT"
      - name: Promote the tested image for production pickup
        env:
          REPOSITORY: ${{ steps.image.outputs.image }}
          SHA: ${{ steps.image.outputs.sha }}
        run: |
          set -Eeuo pipefail
          repository="${REPOSITORY%@*}"
          docker tag "$repository:git-$SHA" "$repository:production"
          docker push "$repository:production"
      - name: Write deployment summary
        run: |
          {
            echo "## Production release published"
            echo
            echo "- SHA: \`${{ steps.image.outputs.sha }}\`"
            echo "- Image: \`${{ steps.image.outputs.image }}\`"
            echo "- The Hetzner pull-release timer will deploy this digest."
          } >> "$GITHUB_STEP_SUMMARY"

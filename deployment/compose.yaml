name: mycfc-production

x-production-config: &production-config
  APP_ENV: production
  APP_VERSION: ${APP_VERSION:?set APP_VERSION in /etc/mycfc/mycfc.env}
  GIT_SHA: ${GIT_SHA:?set GIT_SHA in /etc/mycfc/mycfc.env}
  APP_RELEASED_AT: ${APP_RELEASED_AT:-}
  AWS_REGION: ${AWS_REGION:?set AWS_REGION in /etc/mycfc/mycfc.env}
  AWS_ACCESS_KEY_ID: ${AWS_ACCESS_KEY_ID:?set AWS_ACCESS_KEY_ID in /etc/mycfc/mycfc.env}
  AWS_SECRET_ACCESS_KEY: ${AWS_SECRET_ACCESS_KEY:?set AWS_SECRET_ACCESS_KEY in /etc/mycfc/mycfc.env}
  AWS_SESSION_TOKEN: ${AWS_SESSION_TOKEN:-}

x-app: &app
  image: ${MYCFC_IMAGE:?set MYCFC_IMAGE to the immutable ECR image reference in /etc/mycfc/mycfc.env}
  environment:
    <<: *production-config
    PORT: "8080"
    S3_BUCKET_NAME: ${S3_BUCKET_NAME:?set S3_BUCKET_NAME in /etc/mycfc/mycfc.env}
    GALLERY_URL: ${GALLERY_URL:?set GALLERY_URL in /etc/mycfc/mycfc.env}
    CONSENT_TERMS_VERSION: ${CONSENT_TERMS_VERSION:?set CONSENT_TERMS_VERSION in /etc/mycfc/mycfc.env}
    CONSENT_TERMS_SHA256: ${CONSENT_TERMS_SHA256:?set CONSENT_TERMS_SHA256 in /etc/mycfc/mycfc.env}
    CONSENT_TERMS_URL: ${CONSENT_TERMS_URL:?set CONSENT_TERMS_URL in /etc/mycfc/mycfc.env}
    CONSENT_IMAGE_VERSION: ${CONSENT_IMAGE_VERSION:?set CONSENT_IMAGE_VERSION in /etc/mycfc/mycfc.env}
    CONSENT_IMAGE_SHA256: ${CONSENT_IMAGE_SHA256:?set CONSENT_IMAGE_SHA256 in /etc/mycfc/mycfc.env}
    CONSENT_IMAGE_URL: ${CONSENT_IMAGE_URL:?set CONSENT_IMAGE_URL in /etc/mycfc/mycfc.env}
    CONSENT_MINOR_VERSION: ${CONSENT_MINOR_VERSION:?set CONSENT_MINOR_VERSION in /etc/mycfc/mycfc.env}
    CONSENT_MINOR_SHA256: ${CONSENT_MINOR_SHA256:?set CONSENT_MINOR_SHA256 in /etc/mycfc/mycfc.env}
    CONSENT_MINOR_URL: ${CONSENT_MINOR_URL:?set CONSENT_MINOR_URL in /etc/mycfc/mycfc.env}
    PRIVACY_NOTICE_URL: ${PRIVACY_NOTICE_URL:-https://mycfcoimbra.com/legal/privacidade/2026-09-11}
    COOKIE_NOTICE_URL: ${COOKIE_NOTICE_URL:-https://mycfcoimbra.com/legal/cookies/2026-09-06}
    DATA_RIGHTS_CONTACT: ${DATA_RIGHTS_CONTACT:-cfluvialcoimbra@gmail.com}
    PRIVACY_REQUESTS_ENABLED: ${PRIVACY_REQUESTS_ENABLED:-false}
    LOG_LEVEL: ${LOG_LEVEL:-INFO}
    COOKIE_DOMAIN: ${COOKIE_DOMAIN:-}
    TRUSTED_PROXY_CIDRS: 172.30.0.0/24
  depends_on:
    postgres:
      condition: service_healthy
  networks: [mycfc]
  restart: unless-stopped
  stop_grace_period: 30s

services:
  postgres:
    image: postgres:16.9-alpine3.21
    environment:
      POSTGRES_DB: ${POSTGRES_DB:?set POSTGRES_DB in /etc/mycfc/mycfc.env}
      POSTGRES_USER: ${POSTGRES_USER:?set POSTGRES_USER in /etc/mycfc/mycfc.env}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in /etc/mycfc/mycfc.env}
      TZ: Europe/Lisbon
      PGTZ: Europe/Lisbon
    command: ["postgres", "-c", "timezone=Europe/Lisbon"]
    volumes:
      - pgdata:/var/lib/postgresql/data
    networks: [mycfc]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 12
      start_period: 10s
    restart: unless-stopped
    stop_grace_period: 30s

  app-blue:
    <<: *app
    profiles: [blue]

  app-green:
    <<: *app
    profiles: [green]

  db-bootstrap:
    image: ${MYCFC_IMAGE:?set MYCFC_IMAGE to the immutable ECR image reference in /etc/mycfc/mycfc.env}
    command: ["bootstrap-db"]
    environment:
      <<: *production-config
      PRIVACY_EXECUTOR_DB_USER: ${PRIVACY_EXECUTOR_DB_USER:-}
      PRIVACY_EXECUTOR_DB_PASSWORD: ${PRIVACY_EXECUTOR_DB_PASSWORD:-}
      PRIVACY_ACTIVATION_BROKER_DB_USER: ${PRIVACY_ACTIVATION_BROKER_DB_USER:-}
      PRIVACY_ACTIVATION_BROKER_DB_PASSWORD: ${PRIVACY_ACTIVATION_BROKER_DB_PASSWORD:-}
    depends_on:
      postgres:
        condition: service_healthy
    networks: [mycfc]
    profiles: [release]

  migrate:
    image: ${MYCFC_IMAGE:?set MYCFC_IMAGE to the immutable ECR image reference in /etc/mycfc/mycfc.env}
    command: ["migrate"]
    environment:
      <<: *production-config
      PRIVACY_EXECUTOR_DB_USER: ${PRIVACY_EXECUTOR_DB_USER:-}
      PRIVACY_EXECUTOR_DB_PASSWORD: ${PRIVACY_EXECUTOR_DB_PASSWORD:-}
      PRIVACY_ACTIVATION_BROKER_DB_USER: ${PRIVACY_ACTIVATION_BROKER_DB_USER:-}
      PRIVACY_ACTIVATION_BROKER_DB_PASSWORD: ${PRIVACY_ACTIVATION_BROKER_DB_PASSWORD:-}
    depends_on:
      postgres:
        condition: service_healthy
    networks: [mycfc]
    profiles: [release]

  guardian-release-bind:
    image: ${MYCFC_IMAGE:?set MYCFC_IMAGE to the immutable ECR image reference in /etc/mycfc/mycfc.env}
    command: ["bind-guardian-release"]
    env_file:
      - path: ${GUARDIAN_RELEASE_BIND_ENV_FILE:-/etc/mycfc/guardian-release-bind.env}
        required: false
    environment:
      GUARDIAN_RUNTIME_IMAGE_DIGEST: ${GUARDIAN_RUNTIME_IMAGE_DIGEST:-}
    depends_on:
      postgres:
        condition: service_healthy
    networks: [mycfc]
    profiles: [release]
    read_only: true
    tmpfs:
      - /tmp:rw,noexec,nosuid,nodev,size=8m
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    pids_limit: 32
    restart: "no"

  guardian-release-bind-bootstrap:
    image: ${MYCFC_IMAGE:?set MYCFC_IMAGE to the immutable ECR image reference in /etc/mycfc/mycfc.env}
    command: ["provision-guardian-release-bind"]
    environment:
      <<: *production-config
    env_file:
      - path: ${GUARDIAN_RELEASE_BIND_ENV_FILE:-/etc/mycfc/guardian-release-bind.env}
        required: false
    depends_on:
      postgres:
        condition: service_healthy
    networks: [mycfc]
    profiles: [guardian-release-bind-bootstrap]
    read_only: true
    tmpfs:
      - /tmp:rw,noexec,nosuid,nodev,size=8m
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    pids_limit: 32
    restart: "no"

  privacy-activation-disable-bootstrap:
    image: ${MYCFC_IMAGE:?set MYCFC_IMAGE to the immutable ECR image reference in /etc/mycfc/mycfc.env}
    command: ["provision-privacy-activation-disable"]
    environment:
      <<: *production-config
    env_file:
      - path: /etc/mycfc/privacy-activation-disable.env
        required: false
    depends_on:
      postgres:
        condition: service_healthy
    networks: [mycfc]
    profiles: [privacy-activation-disable-bootstrap]
    read_only: true
    tmpfs:
      - /tmp:rw,noexec,nosuid,nodev,size=8m
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    pids_limit: 32
    restart: "no"

  guardian-activation-bootstrap:
    image: ${MYCFC_IMAGE:?set MYCFC_IMAGE to the immutable ECR image reference in /etc/mycfc/mycfc.env}
    command: ["provision-guardian-activation"]
    environment:
      <<: *production-config
    env_file:
      - path: /etc/mycfc/guardian-activation.env
        required: false
    depends_on:
      postgres:
        condition: service_healthy
    networks: [mycfc]
    profiles: [guardian-activation-bootstrap]
    read_only: true
    tmpfs:
      - /tmp:rw,noexec,nosuid,nodev,size=8m
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    pids_limit: 32
    restart: "no"

  privacy-retention:
    image: ${MYCFC_IMAGE:?set MYCFC_IMAGE to the immutable ECR image reference in /etc/mycfc/mycfc.env}
    entrypoint: ["/app/privacy-retention"]
    env_file:
      - path: /etc/mycfc/privacy-retention.env
        required: false
    environment:
      PRIVACY_RETENTION_ENABLED: ${PRIVACY_RETENTION_ENABLED:-false}
    depends_on:
      postgres:
        condition: service_healthy
    networks: [mycfc]
    profiles: [maintenance]
    restart: "no"

  privacy-worker:
    image: ${MYCFC_IMAGE:?set MYCFC_IMAGE to the immutable ECR image reference in /etc/mycfc/mycfc.env}
    entrypoint: ["/app/privacy-worker"]
    command: ["serve"]
    env_file:
      - path: /etc/mycfc/privacy-worker.env
        required: false
    environment:
      PRIVACY_WORKER_ENABLED: ${PRIVACY_WORKER_ENABLED:-false}
      PRIVACY_COMPLETION_ENABLED: ${PRIVACY_COMPLETION_ENABLED:-false}
    volumes:
      - /etc/mycfc/privacy-worker/keys:/run/secrets/mycfc:ro
    depends_on:
      postgres:
        condition: service_healthy
    networks: [mycfc]
    profiles: [privacy-worker]
    init: true
    read_only: true
    tmpfs:
      - /tmp:rw,noexec,nosuid,nodev,size=16m
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    pids_limit: 128
    restart: "no"
    stop_grace_period: 30s

  privacy-activation:
    image: ${MYCFC_IMAGE:?set MYCFC_IMAGE to the immutable ECR image reference in /etc/mycfc/mycfc.env}
    entrypoint: ["/app/privacy-activation"]
    env_file:
      - path: /etc/mycfc/privacy-activation.env
        required: false
    environment:
      PRIVACY_ACTIVATION_CURRENT_IMAGE_DIGEST: ${PRIVACY_ACTIVATION_CURRENT_IMAGE_DIGEST:-}
    volumes:
      - /etc/mycfc/privacy-activation/evidence:/run/privacy-activation:ro
    networks: [mycfc]
    user: "0:0"
    profiles: [privacy-activation]
    read_only: true
    tmpfs:
      - /tmp:rw,noexec,nosuid,nodev,size=8m
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    pids_limit: 64
    restart: "no"

  privacy-activation-disable:
    image: ${MYCFC_IMAGE:?set MYCFC_IMAGE to the immutable ECR image reference in /etc/mycfc/mycfc.env}
    entrypoint: ["/app/privacy-activation"]
    command: ["disable"]
    env_file:
      - path: /etc/mycfc/privacy-activation-disable.env
        required: false
    networks: [mycfc]
    user: "0:0"
    profiles: [privacy-activation-disable]
    read_only: true
    tmpfs:
      - /tmp:rw,noexec,nosuid,nodev,size=8m
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    pids_limit: 32
    restart: "no"

  guardian-activation:
    image: ${MYCFC_IMAGE:?set MYCFC_IMAGE to the immutable ECR image reference in /etc/mycfc/mycfc.env}
    entrypoint: ["/app/guardian-activation"]
    env_file:
      - path: /etc/mycfc/guardian-activation.env
        required: false
    environment:
      GUARDIAN_ACTIVATION_CURRENT_IMAGE_DIGEST: ${GUARDIAN_ACTIVATION_CURRENT_IMAGE_DIGEST:-}
      GUARDIAN_ACTIVATION_APPROVAL_FILE: /run/guardian-activation/approval.json
    volumes:
      - /etc/mycfc/guardian-activation:/run/guardian-activation:ro
    networks: [mycfc]
    user: "0:0"
    profiles: [guardian-activation]
    read_only: true
    tmpfs:
      - /tmp:rw,noexec,nosuid,nodev,size=8m
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    pids_limit: 32
    restart: "no"

  caddy:
    image: mycfc-caddy-ratelimit:2.10.2-v0.1.0
    build:
      context: ..
      dockerfile: deployment/caddy.Dockerfile
    environment:
      MYCFC_DOMAIN: ${MYCFC_DOMAIN:?set MYCFC_DOMAIN in /etc/mycfc/mycfc.env}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - /etc/mycfc/deployment:/etc/mycfc/deployment:ro
      - caddy_data:/data
      - caddy_config:/config
    networks: [mycfc]
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null --header=Host:$${MYCFC_DOMAIN} http://127.0.0.1/health/ready"]
      interval: 10s
      timeout: 3s
      retries: 6
      start_period: 10s
    restart: unless-stopped
    stop_grace_period: 30s

  cloudflared:
    image: cloudflare/cloudflared:2026.7.3@sha256:e39ee8da81ad5e05d77f38d2f51c60ca51bf2a8450ac3abab50c17fdb91d91bf
    command: tunnel --no-autoupdate run --token ${CLOUDFLARE_TUNNEL_TOKEN:?set CLOUDFLARE_TUNNEL_TOKEN in /etc/mycfc/mycfc.env}
    depends_on:
      caddy:
        condition: service_healthy
    networks: [mycfc]
    restart: unless-stopped
    stop_grace_period: 30s

networks:
  mycfc:
    ipam:
      config:
        - subnet: 172.30.0.0/24

volumes:
  pgdata:
  caddy_data:
  caddy_config:

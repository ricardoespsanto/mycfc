name: Privacy activation executor approval
run-name: executor privacy activation approval ${{ inputs.ceremony_id }}

on:
  workflow_dispatch:
    inputs:
      ceremony_id:
        description: Exact ceremony UUID from the protected coordinator summary.
        required: true
        type: string
      material_version_id:
        description: Exact immutable S3 material version from the protected coordinator summary.
        required: true
        type: string
      material_sha256:
        description: Exact material SHA-256 from the protected coordinator summary.
        required: true
        type: string
      source_sha:
        description: Exact current signed and CI-green main commit bound by the material.
        required: true
        type: string
      image_digest:
        description: Exact active application image digest bound by the material.
        required: true
        type: string
      schema_migration_digest:
        description: Exact deployed schema migration digest bound by the material.
        required: true
        type: string

permissions: {}

concurrency:
  group: privacy-activation-executor-${{ inputs.ceremony_id }}
  cancel-in-progress: false

jobs:
  approve:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    environment: privacy-activation-executor
    permissions:
      actions: read
      contents: read
      id-token: write
    steps:
      - name: Verify the fixed executor human before requesting OIDC
        env:
          ACTUAL_GITHUB_ACTOR_ID: ${{ github.actor_id }}
          EXPECTED_GITHUB_ACTOR_ID: ${{ vars.PRIVACY_ACTIVATION_EXECUTOR_GITHUB_ACTOR_ID }}
        run: |
          set -Eeuo pipefail
          [[ "$ACTUAL_GITHUB_ACTOR_ID" =~ ^[1-9][0-9]{0,19}$ ]]
          [[ "$EXPECTED_GITHUB_ACTOR_ID" =~ ^[1-9][0-9]{0,19}$ ]]
          test "$ACTUAL_GITHUB_ACTOR_ID" = "$EXPECTED_GITHUB_ACTOR_ID"
      # actions/checkout v7.0.1
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ inputs.source_sha }}
          fetch-depth: 1
          persist-credentials: false
      - name: Verify the exact current main source before requesting OIDC
        env:
          DISPATCH_REF: ${{ github.ref }}
          DISPATCH_SHA: ${{ github.sha }}
          EXPECTED_SOURCE_SHA: ${{ inputs.source_sha }}
          GH_TOKEN: ${{ github.token }}
        run: |
          set -Eeuo pipefail
          [[ "$EXPECTED_SOURCE_SHA" =~ ^[0-9a-f]{40}$ ]]
          test "$DISPATCH_REF" = refs/heads/main
          test "$DISPATCH_SHA" = "$EXPECTED_SOURCE_SHA"
          test "$(git rev-parse HEAD)" = "$EXPECTED_SOURCE_SHA"
          test "$(git ls-remote origin refs/heads/main | cut -f1)" = "$EXPECTED_SOURCE_SHA"
          verified_commit=$(gh api "/repos/${{ github.repository }}/commits/$EXPECTED_SOURCE_SHA" \
            --jq 'select(.commit.verification.verified == true and .commit.verification.reason == "valid") | .sha')
          test "$verified_commit" = "$EXPECTED_SOURCE_SHA"
          ci_run=$(gh api "/repos/${{ github.repository }}/actions/workflows/ci.yml/runs?branch=main&event=push&status=completed&per_page=100" \
            --jq "([.workflow_runs[] | select(.head_sha == \"$EXPECTED_SOURCE_SHA\" and .head_branch == \"main\" and .event == \"push\" and .conclusion == \"success\")][0].id) // empty")
          test -n "$ci_run"
      # actions/setup-go v7.0.0
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e
        with:
          go-version-file: go.mod
          cache: true
      - name: Build the signing-only approval verifier
        run: |
          set -Eeuo pipefail
          umask 077
          go build -trimpath -o "$RUNNER_TEMP/mycfc-privacy-activation-approval" ./cmd/privacy-activation-approval
          test -x "$RUNNER_TEMP/mycfc-privacy-activation-approval"
      - name: Install the protected signer registry without logging it
        env:
          SIGNER_REGISTRY_JSON: ${{ secrets.PRIVACY_ACTIVATION_SIGNER_REGISTRY_JSON }}
          SIGNER_REGISTRY_SHA256: ${{ vars.PRIVACY_ACTIVATION_SIGNER_REGISTRY_SHA256 }}
        run: |
          set -Eeuo pipefail
          umask 077
          test -n "$SIGNER_REGISTRY_JSON"
          [[ "$SIGNER_REGISTRY_SHA256" =~ ^[0-9a-f]{64}$ ]]
          printf '%s' "$SIGNER_REGISTRY_JSON" > "$RUNNER_TEMP/signer-registry.json"
          chmod 0600 "$RUNNER_TEMP/signer-registry.json"
          test "$(sha256sum "$RUNNER_TEMP/signer-registry.json" | cut -d' ' -f1)" = "$SIGNER_REGISTRY_SHA256"
      # aws-actions/configure-aws-credentials v6.2.4
      - name: Assume only the fixed executor signing role
        uses: aws-actions/configure-aws-credentials@cbe3b392738ccf3f987d68400dafcf4b0624a56c
        with:
          role-to-assume: arn:aws:iam::334960985019:role/mycfc-production-privacy-activation-exchange-executor
          aws-region: eu-west-1
          role-duration-seconds: 900
      - name: Verify, sign, self-verify, and submit the fixed executor approval
        env:
          PRIVACY_ACTIVATION_ROLE: EXECUTOR
          PRIVACY_ACTIVATION_GITHUB_ENVIRONMENT: privacy-activation-executor
          PRIVACY_ACTIVATION_EXPECTED_GITHUB_ACTOR_ID: ${{ vars.PRIVACY_ACTIVATION_EXECUTOR_GITHUB_ACTOR_ID }}
          PRIVACY_ACTIVATION_EXCHANGE_BUCKET: ${{ vars.PRIVACY_ACTIVATION_EXCHANGE_BUCKET }}
          PRIVACY_ACTIVATION_EXCHANGE_KMS_KEY_ARN: ${{ vars.PRIVACY_ACTIVATION_EXCHANGE_KMS_KEY_ARN }}
          PRIVACY_ACTIVATION_SIGNING_KEY_ARN: ${{ vars.PRIVACY_ACTIVATION_EXECUTOR_SIGNING_KEY_ARN }}
          PRIVACY_ACTIVATION_SIGNER_REGISTRY_FILE: ${{ runner.temp }}/signer-registry.json
          PRIVACY_ACTIVATION_SIGNER_REGISTRY_SHA256: ${{ vars.PRIVACY_ACTIVATION_SIGNER_REGISTRY_SHA256 }}
          PRIVACY_ACTIVATION_APPROVAL_CLI: ${{ runner.temp }}/mycfc-privacy-activation-approval
          PRIVACY_ACTIVATION_CEREMONY_ID: ${{ inputs.ceremony_id }}
          PRIVACY_ACTIVATION_MATERIAL_VERSION_ID: ${{ inputs.material_version_id }}
          PRIVACY_ACTIVATION_MATERIAL_SHA256: ${{ inputs.material_sha256 }}
          PRIVACY_ACTIVATION_SOURCE_SHA: ${{ inputs.source_sha }}
          PRIVACY_ACTIVATION_POLICY_VERSION: club-2026-09-15-v1
          PRIVACY_ACTIVATION_IMAGE_DIGEST: ${{ inputs.image_digest }}
          PRIVACY_ACTIVATION_SCHEMA_MIGRATION_DIGEST: ${{ inputs.schema_migration_digest }}
        run: ./deployment/privacy-activation-sign-approval.sh
      - name: Remove approval working material
        if: always()
        run: |
          rm -f "$RUNNER_TEMP/signer-registry.json" "$RUNNER_TEMP/mycfc-privacy-activation-approval"

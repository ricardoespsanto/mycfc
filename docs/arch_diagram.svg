<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 600" style="background-color:#f8f9fa; font-family:system-ui, -apple-system, sans-serif;">
  <!-- Grid Background -->
  <defs>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#e9ecef" stroke-width="1"/>
    </pattern>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#495057" />
    </marker>
  </defs>
  <rect width="100%" height="100%" fill="url(#grid)" />

  <!-- Outer AWS Boundary -->
  <rect x="50" y="50" width="800" height="500" rx="10" fill="none" stroke="#ff9900" stroke-width="2" stroke-dasharray="5,5"/>
  <text x="70" y="80" fill="#ff9900" font-size="18" font-weight="bold">AWS Cloud</text>

  <!-- Users & DNS -->
  <rect x="100" y="120" width="140" height="60" rx="5" fill="#ffffff" stroke="#495057" stroke-width="2"/>
  <text x="170" y="155" fill="#212529" font-size="14" font-weight="bold" text-anchor="middle">Users (Browser)</text>

  <line x1="240" y1="150" x2="300" y2="150" stroke="#495057" stroke-width="2" marker-end="url(#arrow)"/>

  <rect x="310" y="110" width="140" height="80" rx="5" fill="#e3f2fd" stroke="#0d6efd" stroke-width="2"/>
  <text x="380" y="140" fill="#0d6efd" font-size="14" font-weight="bold" text-anchor="middle">Route 53</text>
  <text x="380" y="160" fill="#495057" font-size="12" text-anchor="middle">DNS &amp; ACM (SSL)</text>

  <line x1="450" y1="150" x2="510" y2="150" stroke="#495057" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- Compute (App Runner) -->
  <rect x="520" y="100" width="280" height="150" rx="8" fill="#fff3cd" stroke="#ffc107" stroke-width="2"/>
  <text x="660" y="130" fill="#856404" font-size="16" font-weight="bold" text-anchor="middle">AWS App Runner</text>
  <text x="660" y="155" fill="#495057" font-size="14" text-anchor="middle">Monolithic Go Binary</text>
  <text x="660" y="180" fill="#6c757d" font-size="12" text-anchor="middle">templ / HTMX / net/http</text>
  <text x="660" y="200" fill="#6c757d" font-size="12" text-anchor="middle">slog (Structured Logging)</text>

  <!-- Data Layer -->
  <line x1="660" y1="250" x2="660" y2="310" stroke="#495057" stroke-width="2" marker-end="url(#arrow)"/>

  <rect x="520" y="320" width="130" height="80" rx="5" fill="#d1e7dd" stroke="#198754" stroke-width="2"/>
  <text x="585" y="355" fill="#198754" font-size="14" font-weight="bold" text-anchor="middle">AWS RDS</text>
  <text x="585" y="375" fill="#495057" font-size="12" text-anchor="middle">PostgreSQL</text>

  <line x1="660" y1="250" x2="740" y2="310" stroke="#495057" stroke-width="2" marker-end="url(#arrow)"/>

  <rect x="670" y="320" width="130" height="80" rx="5" fill="#d1e7dd" stroke="#198754" stroke-width="2"/>
  <text x="735" y="355" fill="#198754" font-size="14" font-weight="bold" text-anchor="middle">AWS S3</text>
  <text x="735" y="375" fill="#495057" font-size="12" text-anchor="middle">Media Storage</text>

  <!-- CI/CD Pipeline -->
  <rect x="100" y="420" width="160" height="80" rx="5" fill="#f8f9fa" stroke="#212529" stroke-width="2"/>
  <text x="180" y="455" fill="#212529" font-size="14" font-weight="bold" text-anchor="middle">GitHub Actions</text>
  <text x="180" y="475" fill="#6c757d" font-size="12" text-anchor="middle">GitOps CI/CD</text>

  <line x1="260" y1="460" x2="330" y2="460" stroke="#495057" stroke-width="2" marker-end="url(#arrow)"/>

  <rect x="340" y="420" width="120" height="80" rx="5" fill="#e2e3e5" stroke="#6c757d" stroke-width="2"/>
  <text x="400" y="455" fill="#495057" font-size="14" font-weight="bold" text-anchor="middle">AWS ECR</text>
  <text x="400" y="475" fill="#6c757d" font-size="12" text-anchor="middle">Docker Registry</text>

  <path d="M 400 420 L 400 210 L 510 210" fill="none" stroke="#495057" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="330" y="320" fill="#495057" font-size="12" text-anchor="middle" transform="rotate(-90 330,320)">Pulls Container Image</text>

  <!-- Migrations Line -->
  <path d="M 180 420 L 180 360 L 510 360" fill="none" stroke="#198754" stroke-width="2" stroke-dasharray="4,4" marker-end="url(#arrow)"/>
  <text x="350" y="350" fill="#198754" font-size="12" font-weight="bold" text-anchor="middle">goose up (Migrations)</text>
</svg>

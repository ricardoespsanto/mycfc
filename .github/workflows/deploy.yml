name: Deploy production

on:
  workflow_run:
    workflows: [CI]
    branches: [main]
    types: [completed]
  workflow_dispatch:
    inputs:
      sha:
        description: Tested main-branch commit to deploy.
        required: true
        type: string

permissions:
  actions: read
  contents: read
  id-token: write

concurrency:
  group: mycfc-production-deploy
  cancel-in-progress: false

jobs:
  deploy:
    if: >-
      (github.event_name == 'workflow_run' && github.event.workflow_run.conclusion == 'success') ||
      github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-24.04
    environment: production
    env:
      AWS_REGION: ${{ vars.AWS_REGION }}
      HETZNER_HOST: ${{ vars.HETZNER_HOST }}
      HETZNER_KNOWN_HOSTS: ${{ vars.HETZNER_KNOWN_HOSTS }}
      HETZNER_DEPLOY_SSH_KEY: ${{ secrets.HETZNER_DEPLOY_SSH_KEY }}
    steps:
      # actions/checkout v7.0.1
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.event_name == 'workflow_run' && github.event.workflow_run.head_sha || inputs.sha }}
          fetch-depth: 0
      - name: Verify a tested main commit
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -Eeuo pipefail
          SHA="${{ github.event_name == 'workflow_run' && github.event.workflow_run.head_sha || inputs.sha }}"
          git merge-base --is-ancestor "$SHA" origin/main
          test "$(git rev-parse HEAD)" = "$SHA"
          if [[ "${{ github.event_name }}" == workflow_dispatch ]]; then
            test -n "$(gh api "/repos/${{ github.repository }}/actions/runs?head_sha=$SHA&status=completed&per_page=100" \
              --jq '.workflow_runs[] | select(.name == "CI" and .conclusion == "success") | .id')"
          fi
      # aws-actions/configure-aws-credentials v6.2.3
      - uses: aws-actions/configure-aws-credentials@e6de054238d6b7531b4efff3b6587d9aade6a06c
        with:
          role-to-assume: ${{ vars.AWS_DEPLOY_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION }}
      - id: ecr-login
        # aws-actions/amazon-ecr-login v2.1.6
        uses: aws-actions/amazon-ecr-login@d539f0932e70871a027e9d5a9d8fc38589180a64
      - name: Build and push the immutable image
        id: image
        run: |
          set -Eeuo pipefail
          SHA="$(git rev-parse HEAD)"
          ACCOUNT_ID="$(aws sts get-caller-identity --query Account --output text)"
          REPOSITORY="$ACCOUNT_ID.dkr.ecr.$AWS_REGION.amazonaws.com/mycfc-production"
          IMAGE="$REPOSITORY:git-$SHA"
          docker build --label "org.opencontainers.image.revision=$SHA" -t "$IMAGE" .
          docker push "$IMAGE"
          DIGEST="$(aws ecr describe-images --repository-name mycfc-production --image-ids imageTag="git-$SHA" --query 'imageDetails[0].imageDigest' --output text)"
          printf 'image=%s@%s\nregistry=%s\nsha=%s\n' "$REPOSITORY" "$DIGEST" "${REPOSITORY%%/*}" "$SHA" >> "$GITHUB_OUTPUT"
      - name: Configure deployment SSH key
        run: |
          set -Eeuo pipefail
          umask 077
          mkdir -p ~/.ssh
          printf '%s\n' "$HETZNER_DEPLOY_SSH_KEY" > ~/.ssh/id_ed25519
          test -n "$HETZNER_KNOWN_HOSTS"
          printf '%s\n' "$HETZNER_KNOWN_HOSTS" > ~/.ssh/known_hosts
      - name: Authenticate Hetzner Docker to ECR
        env:
          ECR_REGISTRY: ${{ steps.image.outputs.registry }}
        run: |
          set -Eeuo pipefail
          aws ecr get-login-password --region "$AWS_REGION" | ssh deploy@"$HETZNER_HOST" \
            "sudo docker login --username AWS --password-stdin $ECR_REGISTRY"
      - name: Update the Hetzner application
        env:
          IMAGE: ${{ steps.image.outputs.image }}
          SHA: ${{ steps.image.outputs.sha }}
        run: |
          set -Eeuo pipefail
          ssh deploy@"$HETZNER_HOST" "
            sudo sed -i 's|^MYCFC_IMAGE=.*|MYCFC_IMAGE=$IMAGE|; s|^APP_VERSION=.*|APP_VERSION=$SHA|; s|^GIT_SHA=.*|GIT_SHA=$SHA|' /etc/mycfc/mycfc.env
            sudo docker compose --env-file /etc/mycfc/mycfc.env -f /opt/mycfc/deployment/compose.yaml pull
            sudo docker compose --env-file /etc/mycfc/mycfc.env -f /opt/mycfc/deployment/compose.yaml up -d --wait
          "
      - name: Smoke test production endpoints
        run: |
          set -Eeuo pipefail
          asset_path="$(jq -r '."app.js"' ui/static/dist/manifest.json)"
          for attempt in {1..20}; do
            health="$(curl --silent --show-error --output /dev/null --write-out '%{http_code}' --max-time 10 https://mycfcoimbra.com/health/ready || true)"
            login="$(curl --silent --show-error --output /dev/null --write-out '%{http_code}' --max-time 10 https://mycfcoimbra.com/login || true)"
            asset="$(curl --silent --show-error --output /dev/null --write-out '%{http_code}' --max-time 10 "https://mycfcoimbra.com$asset_path" || true)"
            if [[ "$health" == 200 && "$login" == 200 && "$asset" == 200 ]]; then
              exit 0
            fi
            sleep 15
          done
          printf 'Smoke checks failed: health=%s login=%s static_asset=%s\n' "$health" "$login" "$asset" >&2
          exit 1
      - name: Write deployment summary
        run: |
          {
            echo "## Hetzner production deployment"
            echo
            echo "- SHA: \`${{ steps.image.outputs.sha }}\`"
            echo "- Image: \`${{ steps.image.outputs.image }}\`"
            echo "- Host: \`$HETZNER_HOST\`"
          } >> "$GITHUB_STEP_SUMMARY"

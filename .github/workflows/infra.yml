name: Infrastructure

on:
  pull_request:
    paths:
      - infra/**
      - Makefile
  push:
    branches: [main]
    paths:
      - infra/**
      - Makefile
  workflow_dispatch:

permissions:
  contents: read

jobs:
  checks:
    runs-on: ubuntu-24.04
    steps:
      # actions/checkout v7.0.1
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - name: Format, validate, and lint every Terraform root module
        run: make terraform-check

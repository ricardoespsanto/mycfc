name: Publish legacy media purge image

on:
  workflow_dispatch:
    inputs:
      sha:
        description: Tested main-branch commit to package as the one-time purge image.
        required: true
        type: string

permissions:
  actions: read
  attestations: write
  contents: read
  id-token: write

concurrency:
  group: mycfc-legacy-media-purge-image
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-24.04
    environment: production
    env:
      AWS_REGION: ${{ vars.AWS_REGION }}
    steps:
      # actions/checkout v7.0.1
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ inputs.sha }}
          fetch-depth: 0
      - name: Verify a tested main commit
        env:
          GH_TOKEN: ${{ github.token }}
          REQUESTED_SHA: ${{ inputs.sha }}
          WORKFLOW_REF: ${{ github.ref }}
          WORKFLOW_SHA: ${{ github.sha }}
        run: |
          set -Eeuo pipefail
          test "${#REQUESTED_SHA}" -eq 40
          test "$WORKFLOW_REF" = refs/heads/main
          test "$REQUESTED_SHA" = "$WORKFLOW_SHA"
          test "$(git rev-parse HEAD)" = "$REQUESTED_SHA"
          git merge-base --is-ancestor "$REQUESTED_SHA" origin/main
          test -n "$(gh api "/repos/${{ github.repository }}/actions/runs?head_sha=$REQUESTED_SHA&status=completed&per_page=100" \
            --jq '.workflow_runs[] | select(.name == "CI" and .conclusion == "success") | .id')"
      # aws-actions/configure-aws-credentials v6.2.4
      - uses: aws-actions/configure-aws-credentials@cbe3b392738ccf3f987d68400dafcf4b0624a56c
        with:
          role-to-assume: ${{ vars.AWS_DEPLOY_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION }}
      - id: ecr-login
        # aws-actions/amazon-ecr-login v2.1.6
        uses: aws-actions/amazon-ecr-login@03f1aad4c6c7ffd436567f42f9384779290529bd
      - name: Reserve an unused immutable purge image reference
        id: image
        env:
          REGISTRY: ${{ steps.ecr-login.outputs.registry }}
          SHA: ${{ inputs.sha }}
        run: |
          set -Eeuo pipefail
          image="$REGISTRY/mycfc-production:purge-$SHA"
          digest=$(aws ecr describe-images --repository-name mycfc-production --image-ids imageTag="purge-$SHA" --query 'imageDetails[0].imageDigest' --output text 2>/dev/null || true)
          if [[ "$digest" == sha256:* ]]; then
            echo 'The purge tag already exists; refusing to trust or reuse a pre-seeded image.' >&2
            exit 1
          fi
          echo "image=$image" >> "$GITHUB_OUTPUT"
      # docker/setup-buildx-action v4.3.0
      - uses: docker/setup-buildx-action@37fe631027851001ddb9b187196cc803df7f5f0e
      - name: Build and publish purge-only image
        id: build
        # docker/build-push-action v7.3.0
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a
        with:
          context: .
          file: Dockerfile.legacy-media-purge
          push: true
          tags: ${{ steps.image.outputs.image }}
          labels: org.opencontainers.image.revision=${{ inputs.sha }}
          cache-from: type=gha,scope=legacy-media-purge
          cache-to: type=gha,mode=max,scope=legacy-media-purge
          provenance: false
      - name: Attest the published image provenance
        # actions/attest-build-provenance v4.2.2
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8
        with:
          subject-name: ${{ steps.ecr-login.outputs.registry }}/mycfc-production
          subject-digest: ${{ steps.build.outputs.digest }}
          push-to-registry: true
      - name: Verify immutable purge image
        env:
          EXPECTED_SHA: ${{ inputs.sha }}
          IMAGE: ${{ steps.image.outputs.image }}
          IMAGE_DIGEST: ${{ steps.build.outputs.digest }}
        run: |
          set -Eeuo pipefail
          [[ "$IMAGE" == *":purge-$EXPECTED_SHA" ]]
          [[ "$IMAGE_DIGEST" == sha256:* ]]
          revision=$(docker buildx imagetools inspect --format '{{index .Image.Config.Labels "org.opencontainers.image.revision"}}' "$IMAGE")
          test "$revision" = "$EXPECTED_SHA"
          gh attestation verify "oci://${IMAGE%:*}@$IMAGE_DIGEST" \
            --repo "${{ github.repository }}" \
            --signer-workflow "${{ github.repository }}/.github/workflows/legacy-media-purge-image.yml" \
            --source-digest "$EXPECTED_SHA" \
            --deny-self-hosted-runners >/dev/null
          echo "image_by_digest=${IMAGE%:*}@$IMAGE_DIGEST" >> "$GITHUB_ENV"
      - name: Write publication summary
        run: |
          {
            echo '## One-time legacy media purge image published'
            echo
            echo "- Source SHA: \`${{ inputs.sha }}\`"
            echo "- Immutable image: \`$image_by_digest\`"
            echo '- This purge-only image is not a production release and is never selected by the deployment agent.'
            echo '- Publishing does not grant S3 permission and does not execute the purge.'
          } >> "$GITHUB_STEP_SUMMARY"

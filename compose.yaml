name: mycfc

services:
  postgres:
    image: postgres:16.9-alpine3.21
    environment:
      POSTGRES_DB: ${POSTGRES_DB:?set POSTGRES_DB in .env}
      POSTGRES_USER: ${POSTGRES_USER:?set POSTGRES_USER in .env}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
      TZ: Europe/Lisbon
      PGTZ: Europe/Lisbon
    command: ["postgres", "-c", "timezone=Europe/Lisbon"]
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    networks: [mycfc]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 2s
      timeout: 3s
      retries: 30
      start_period: 5s
    stop_grace_period: 30s

  minio:
    image: minio/minio:RELEASE.2025-09-07T16-13-09Z
    environment:
      MINIO_ROOT_USER: ${AWS_ACCESS_KEY_ID:?set AWS_ACCESS_KEY_ID in .env}
      MINIO_ROOT_PASSWORD: ${AWS_SECRET_ACCESS_KEY:?set AWS_SECRET_ACCESS_KEY in .env}
      MINIO_KMS_SECRET_KEY: ${MINIO_KMS_SECRET_KEY:-mycfc-local:MDEyMzQ1Njc4OWFiY2RlZjAxMjM0NTY3ODlhYmNkZWY=}
    command: ["server", "/data", "--console-address", ":9001"]
    ports:
      - "127.0.0.1:9000:9000"
      - "127.0.0.1:9001:9001"
    volumes:
      - miniodata:/data
    networks: [mycfc]
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 2s
      timeout: 3s
      retries: 30
      start_period: 5s

  minio-init:
    image: minio/mc:RELEASE.2025-08-13T08-35-41Z
    depends_on:
      minio:
        condition: service_healthy
    environment:
      MINIO_ROOT_USER: ${AWS_ACCESS_KEY_ID:?set AWS_ACCESS_KEY_ID in .env}
      MINIO_ROOT_PASSWORD: ${AWS_SECRET_ACCESS_KEY:?set AWS_SECRET_ACCESS_KEY in .env}
    entrypoint:
      - /bin/sh
      - -ec
      - |
        mc alias set local http://minio:9000 "$${MINIO_ROOT_USER}" "$${MINIO_ROOT_PASSWORD}"
        mc mb --ignore-existing local/mycfc-local
        mc anonymous set none local/mycfc-local
    networks: [mycfc]
    restart: "no"

  e2e-app:
    image: golang:1.26.5-bookworm
    profiles: [e2e]
    working_dir: /workspace
    env_file: .env
    environment:
      BASE_URL: http://e2e-app:8080
      DATABASE_URL: postgres://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}?sslmode=disable
      S3_ENDPOINT: http://minio:9000
      CONSENT_TERMS_URL: http://e2e-app:8080/legal/termos-gerais
      CONSENT_IMAGE_URL: http://e2e-app:8080/legal/uso-imagem
      CONSENT_MINOR_URL: http://e2e-app:8080/legal/responsabilidade-menor
    command: go run ./cmd/server
    depends_on:
      postgres:
        condition: service_healthy
      minio:
        condition: service_healthy
    volumes:
      - .:/workspace
      - e2e_go_cache:/go/pkg/mod
      - e2e_go_build:/root/.cache/go-build
    networks: [mycfc]

  e2e:
    image: mcr.microsoft.com/playwright:v1.55.0-noble
    profiles: [e2e]
    working_dir: /workspace
    environment:
      E2E_BASE_URL: http://e2e-app:8080
      CI: "true"
    command:
      - /bin/sh
      - -ec
      - |
        npm ci
        node -e 'const url = "http://e2e-app:8080/health/ready"; const deadline = Date.now() + 60000; const check = async () => { try { if ((await fetch(url)).ok) return; } catch {} if (Date.now() >= deadline) process.exit(1); setTimeout(check, 250); }; check();'
        npm run test:e2e
    depends_on:
      e2e-app:
        condition: service_started
    volumes:
      - .:/workspace
      - e2e_node_modules:/workspace/node_modules
    shm_size: 1gb
    networks: [mycfc]

networks:
  mycfc:
    name: mycfc

volumes:
  pgdata:
  miniodata:
  e2e_go_cache:
  e2e_go_build:
  e2e_node_modules:

name: mycfc

services:
  postgres:
    image: postgres:16.9-alpine3.21
    environment:
      POSTGRES_DB: ${POSTGRES_DB:?set POSTGRES_DB in .env}
      POSTGRES_USER: ${POSTGRES_USER:?set POSTGRES_USER in .env}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
      TZ: Europe/Lisbon
      PGTZ: Europe/Lisbon
    command: ["postgres", "-c", "timezone=Europe/Lisbon"]
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    networks: [mycfc]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 2s
      timeout: 3s
      retries: 30
      start_period: 5s
    stop_grace_period: 30s

  minio:
    image: minio/minio:RELEASE.2025-09-07T16-13-09Z
    environment:
      MINIO_ROOT_USER: ${AWS_ACCESS_KEY_ID:?set AWS_ACCESS_KEY_ID in .env}
      MINIO_ROOT_PASSWORD: ${AWS_SECRET_ACCESS_KEY:?set AWS_SECRET_ACCESS_KEY in .env}
      MINIO_KMS_SECRET_KEY: ${MINIO_KMS_SECRET_KEY:-mycfc-local:MDEyMzQ1Njc4OWFiY2RlZjAxMjM0NTY3ODlhYmNkZWY=}
    command: ["server", "/data", "--console-address", ":9001"]
    ports:
      - "127.0.0.1:9000:9000"
      - "127.0.0.1:9001:9001"
    volumes:
      - miniodata:/data
    networks: [mycfc]
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 2s
      timeout: 3s
      retries: 30
      start_period: 5s

  minio-init:
    image: minio/mc:RELEASE.2025-08-13T08-35-41Z
    depends_on:
      minio:
        condition: service_healthy
    environment:
      MINIO_ROOT_USER: ${AWS_ACCESS_KEY_ID:?set AWS_ACCESS_KEY_ID in .env}
      MINIO_ROOT_PASSWORD: ${AWS_SECRET_ACCESS_KEY:?set AWS_SECRET_ACCESS_KEY in .env}
    entrypoint:
      - /bin/sh
      - -ec
      - |
        mc alias set local http://minio:9000 "$${MINIO_ROOT_USER}" "$${MINIO_ROOT_PASSWORD}"
        mc mb --ignore-existing local/mycfc-local
        mc anonymous set none local/mycfc-local
    networks: [mycfc]
    restart: "no"

  mailpit:
    image: axllent/mailpit:v1.30.0
    ports:
      - "127.0.0.1:1025:1025"
      - "127.0.0.1:8025:8025"
    networks: [mycfc]
    healthcheck:
      test: ["CMD", "/mailpit", "readyz"]
      interval: 2s
      timeout: 3s
      retries: 30

  e2e-app:
    image: golang:1.26.5-bookworm
    profiles: [e2e]
    working_dir: /workspace
    env_file: .env
    environment:
      BASE_URL: http://e2e-app:8080
      DATABASE_URL: postgres://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}?sslmode=disable
      S3_BUCKET_NAME: mycfc-local
      S3_ENDPOINT: http://minio:9000
      S3_FORCE_PATH_STYLE: "true"
      SMTP_HOST: mailpit
      SMTP_PORT: "1025"
      SMTP_TLS_MODE: none
      SMTP_FROM_ADDRESS: mycfc@example.test
      EMAIL_VERIFICATION_HMAC_KEY_B64: MDEyMzQ1Njc4OWFiY2RlZjAxMjM0NTY3ODlhYmNkZWY=
      CONSENT_TERMS_URL: http://e2e-app:8080/legal/termos-gerais
      CONSENT_IMAGE_URL: http://e2e-app:8080/legal/uso-imagem
      CONSENT_MINOR_URL: http://e2e-app:8080/legal/responsabilidade-menor
    command: go run ./cmd/server
    depends_on:
      postgres:
        condition: service_healthy
      minio:
        condition: service_healthy
      mailpit:
        condition: service_healthy
    volumes:
      - .:/workspace
      - e2e_go_cache:/go/pkg/mod
      - e2e_go_build:/root/.cache/go-build
    networks: [mycfc]

  e2e-seed:
    image: postgres:16.9-alpine3.21
    profiles: [e2e]
    environment:
      PGHOST: postgres
      PGUSER: ${POSTGRES_USER}
      PGPASSWORD: ${POSTGRES_PASSWORD}
      PGDATABASE: ${POSTGRES_DB}
    command:
      - /bin/sh
      - -ec
      - |
        psql -v ON_ERROR_STOP=1 -c "INSERT INTO equipment (asset_tag, name, type) VALUES ('E2E-REPAIR', 'Embarcação de teste', 'Boat') ON CONFLICT (asset_tag) DO UPDATE SET name = EXCLUDED.name, type = EXCLUDED.type, status = 'Operational', notes = ''"
        psql -v ON_ERROR_STOP=1 -c "INSERT INTO users (name, email, password_hash, date_of_birth) VALUES ('Administrador de teste', 'e2e-admin@example.test', '\$$2a\$$12\$$IQnXrEKbby1M4yt9/NQofOdWrlC7X9ogAGG0yJYfRknRdVdsugeRK', '1990-01-01') ON CONFLICT (email) WHERE email IS NOT NULL DO UPDATE SET name = EXCLUDED.name, password_hash = EXCLUDED.password_hash, guardian_id = NULL, is_dependent = false, date_of_birth = EXCLUDED.date_of_birth, is_active = true"
        psql -v ON_ERROR_STOP=1 -c "INSERT INTO user_platform_roles (user_id, role_id) SELECT u.id, r.id FROM users u JOIN platform_roles r ON r.code = 'ADMIN' WHERE u.email = 'e2e-admin@example.test' ON CONFLICT DO NOTHING"
    depends_on:
      postgres:
        condition: service_healthy
    networks: [mycfc]

  e2e:
    image: mcr.microsoft.com/playwright:v1.62.0-noble
    profiles: [e2e]
    working_dir: /workspace
    environment:
      E2E_BASE_URL: http://e2e-app:8080
      MAILPIT_API_BASE: http://mailpit:8025
      CI: "true"
    command:
      - /bin/sh
      - -ec
      - |
        npm ci
        node -e 'const url = "http://e2e-app:8080/health/ready"; const deadline = Date.now() + 600000; const check = async () => { try { if ((await fetch(url)).ok) return; } catch {} if (Date.now() >= deadline) throw new Error("e2e app readiness timed out"); await new Promise(resolve => setTimeout(resolve, 250)); return check(); }; check().catch(error => { console.error(error); process.exit(1); });'
        npm run test:e2e
    depends_on:
      e2e-app:
        condition: service_started
      e2e-seed:
        condition: service_completed_successfully
    volumes:
      - .:/workspace
      - e2e_node_modules:/workspace/node_modules
    shm_size: 1gb
    networks: [mycfc]

  ui-review-app:
    image: golang:1.26.5-bookworm
    profiles: [ui-review]
    working_dir: /workspace
    env_file: .env
    environment:
      BASE_URL: http://ui-review-app:8080
      DATABASE_URL: postgres://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/mycfc_ui_review?sslmode=disable
      S3_BUCKET_NAME: mycfc-local
      S3_ENDPOINT: http://minio:9000
      S3_FORCE_PATH_STYLE: "true"
      SMTP_HOST: mailpit
      SMTP_PORT: "1025"
      SMTP_TLS_MODE: none
      SMTP_FROM_ADDRESS: mycfc@example.test
      EMAIL_VERIFICATION_HMAC_KEY_B64: MDEyMzQ1Njc4OWFiY2RlZjAxMjM0NTY3ODlhYmNkZWY=
      CONSENT_TERMS_URL: http://ui-review-app:8080/legal/termos-gerais
      CONSENT_IMAGE_URL: http://ui-review-app:8080/legal/uso-imagem
      CONSENT_MINOR_URL: http://ui-review-app:8080/legal/responsabilidade-menor
    command: go run ./cmd/server
    depends_on:
      postgres:
        condition: service_healthy
      minio:
        condition: service_healthy
      mailpit:
        condition: service_healthy
    volumes:
      - .:/workspace
      - e2e_go_cache:/go/pkg/mod
      - e2e_go_build:/root/.cache/go-build
    networks: [mycfc]

  ui-review-capture:
    image: mcr.microsoft.com/playwright:v1.62.0-noble
    profiles: [ui-review]
    working_dir: /workspace
    environment:
      E2E_BASE_URL: http://ui-review-app:8080
      UI_REVIEW: "1"
      CI: "true"
    command:
      - /bin/sh
      - -ec
      - |
        npm ci
        node -e 'const url = "http://ui-review-app:8080/health/ready"; const deadline = Date.now() + 600000; const check = async () => { try { if ((await fetch(url)).ok) return; } catch {} if (Date.now() >= deadline) throw new Error("UI-review app readiness timed out"); await new Promise(resolve => setTimeout(resolve, 250)); return check(); }; check().catch(error => { console.error(error); process.exit(1); });'
        npm exec playwright test e2e/ui-review.spec.mjs
    depends_on:
      ui-review-app:
        condition: service_started
    volumes:
      - .:/workspace
      - e2e_node_modules:/workspace/node_modules
    shm_size: 1gb
    networks: [mycfc]

networks:
  mycfc:
    name: mycfc

volumes:
  pgdata:
  miniodata:
  e2e_go_cache:
  e2e_go_build:
  e2e_node_modules:

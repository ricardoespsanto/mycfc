<text x="320" y="544" class="small" font-weight="800">Objetivo</text><rect x="320" y="561" width="360" height="60" rx="9" class="field"/><text x="340" y="599" class="body">Velocidade específica</text>
<text x="320" y="668" class="small" font-weight="800">Repetições</text><rect x="320" y="685" width="165" height="60" rx="9" class="field"/><text x="340" y="723" class="body">4</text>
